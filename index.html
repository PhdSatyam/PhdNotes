<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thesis Reading Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3EEE2; --panel:#FBF8F0; --side:#EDE6D6; --ink:#1E1A15; --muted:#6A5B49; --line:#DCD2BD; --edge:#C9BCA2;
  --green:#2F4A33; --green-soft:#E3EAD8; --maroon:#7A1F2B; --maroon-soft:#F0DEDB; --brown:#5C4430; --brown-soft:#EFE3D0;
  --accent:var(--green);
  --ui:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --serif:'Source Serif 4',Georgia,serif; --display:'Fraunces','Source Serif 4',Georgia,serif;
  --hc0:#E6D58A; --hc1:#B7D3A5; --hc2:#E4B0AC; --hc3:#D9BE98;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#14120E; --panel:#1C1914; --side:#181510; --ink:#ECE5D4; --muted:#B3A58F; --line:#322C22; --edge:#4A4132;
  --green:#A5C595; --green-soft:#222B1F; --maroon:#E1949C; --maroon-soft:#33201F; --brown:#D1AE82; --brown-soft:#2B2318;
  --hc0:#7A6B22; --hc1:#3F5E36; --hc2:#703A3A; --hc3:#6B5233;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:14px;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.muted{color:var(--muted)}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--maroon);font-weight:600}

/* top bar */
.bar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:18px;padding:0 20px;height:54px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{font-family:var(--display);font-weight:600;font-size:18px;color:var(--maroon);white-space:nowrap}
.tabs{display:flex;gap:2px;height:100%}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:0 16px;font-weight:600;color:var(--muted);font-size:14px}
.sh2{display:none}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--green);border-bottom-color:var(--green)}
.tools{margin-left:auto;display:flex;align-items:center;gap:6px}
.tb{border:1px solid var(--edge);background:transparent;border-radius:8px;height:30px;min-width:32px;padding:0 9px;font-weight:600}
.tb:hover{background:var(--green-soft)}
.save{font-size:11px;color:var(--muted);margin-right:6px;white-space:nowrap}
.save.acc{color:var(--green)}
#menu{display:none}

/* layout */
.app{display:grid;grid-template-columns:310px minmax(0,1fr);align-items:start}
.app.noside{grid-template-columns:minmax(0,1fr)}
.app.noside .side{display:none}
.side{position:sticky;top:54px;height:calc(100vh - 54px);overflow-y:auto;background:var(--side);border-right:1px solid var(--line);padding:16px 14px 40px}
.main{min-width:0;padding:30px 34px 80px}
.sh{margin-bottom:12px}
.sh h2{font-family:var(--display);font-size:19px;line-height:1.2;margin:2px 0 6px;color:var(--ink)}
.meter{height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--green)}
.pill{display:flex;gap:4px;margin:12px 0 10px}
.pill button{flex:1;border:1px solid var(--edge);background:transparent;border-radius:8px;padding:5px 0;font-weight:600;color:var(--muted)}
.pill button[aria-pressed="true"]{background:var(--green);color:var(--panel);border-color:var(--green)}
:root[data-theme="dark"] .pill button[aria-pressed="true"]{color:#14120E}
.phh{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--brown);font-weight:600;margin:16px 4px 5px}
.ch{display:flex;gap:9px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:7px 8px;align-items:flex-start}
.ch:hover{background:var(--green-soft)}
.ch.cur{background:var(--green-soft)}
.ch .cn{font-family:ui-monospace,monospace;font-size:11px;color:var(--muted);min-width:20px;padding-top:2px}
.ch .ct{flex:1;font-weight:500;line-height:1.3}
.ch.cur .ct{color:var(--green);font-weight:600}
.ch .cp{font-size:11px;color:var(--muted);padding-top:2px}
.ch.done .cp{color:var(--green);font-weight:600}
.secs{margin:2px 0 8px 29px;border-left:2px solid var(--line)}
.sec{display:flex;gap:6px;width:100%;text-align:left;background:none;border:0;padding:4px 8px;font-size:12.5px;color:var(--muted);line-height:1.3}
.sec:hover{color:var(--ink)}
.sec.on{color:var(--maroon);font-weight:600;border-left:2px solid var(--maroon);margin-left:-2px}
.sec .ok{color:var(--green);min-width:12px}

/* reader */
.crumb{max-width:70ch;margin:0 auto 10px;font-size:12px;color:var(--muted);letter-spacing:.04em}
.rdoc{max-width:70ch;margin:0 auto;position:relative;font-family:var(--serif);font-size:calc(18px*var(--z,1));line-height:1.72;overflow-wrap:break-word}
.rdoc h1{font-family:var(--display);font-weight:600;font-size:2em;line-height:1.18;color:var(--maroon);margin:.1em 0 .6em}
.rdoc h2{font-family:var(--display);font-weight:600;font-size:1.38em;line-height:1.25;color:var(--green);margin:1.9em 0 .3em}
.rdoc h3{font-family:var(--ui);font-weight:600;font-size:1.02em;color:var(--brown);margin:1.5em 0 .3em}
.rdoc h4,.rdoc h5,.rdoc h6{font-family:var(--ui);font-size:.95em;margin:1.1em 0 .1em;font-weight:600;color:var(--brown)}
.rdoc [id]{scroll-margin-top:76px}
.rdoc p{margin:.75em 0}
.rdoc ul,.rdoc ol{padding-left:1.4em;margin:.6em 0}
.rdoc li{margin:.28em 0}
.rdoc a{color:var(--green)}
.rdoc math{font-size:1.07em}
.rdoc math[display="block"]{display:block;overflow-x:auto;overflow-y:hidden;margin:.9em 0;padding:3px 0}
.rdoc table{border-collapse:collapse;display:block;overflow-x:auto;font-family:var(--ui);font-size:.8em;line-height:1.4;margin:1.1em 0;max-width:100%}
.rdoc th,.rdoc td{border-bottom:1px solid var(--line);padding:5px 10px;text-align:left;vertical-align:top}
.rdoc thead th{border-bottom:2px solid var(--green);white-space:nowrap;color:var(--green)}
.rdoc caption{caption-side:top;text-align:left;font-family:var(--ui);font-size:.95em;color:var(--muted);padding:0 0 6px}
.rdoc figure{margin:1.4em 0;text-align:center}
.rdoc img{max-width:100%;height:auto;background:#fff;border-radius:4px}
:root[data-theme="dark"] .rdoc img{filter:invert(.88) hue-rotate(180deg)}
.rdoc figcaption{font-family:var(--ui);font-size:.82em;color:var(--muted);text-align:left;margin-top:6px}
.rdoc blockquote{border-left:3px solid var(--edge);margin:1em 0;padding:1px 14px;color:var(--muted)}
.box{border-radius:4px;padding:10px 18px;margin:1.2em 0;border-left:4px solid var(--green);background:var(--green-soft)}
.box>*:first-child{margin-top:0}.box>*:last-child{margin-bottom:0}
.box .bt{font-family:var(--ui);font-weight:600;font-size:.72em;text-transform:uppercase;letter-spacing:.09em;color:var(--green);margin-bottom:4px}
.verdictbox{border-left-color:var(--maroon);background:var(--maroon-soft)}
.verdictbox .bt{color:var(--maroon)}
.plainbox,.examplebox{border-left-color:var(--brown);background:var(--brown-soft)}
.plainbox .bt,.examplebox .bt{color:var(--brown)}
.thm{border-left-color:var(--ink);background:transparent;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.thm .bt{color:var(--ink)}
.proof{margin:.6em 0 1em;padding-left:14px;border-left:2px dotted var(--edge)}

/* section bars, highlights, notes */
.secbar{display:flex;gap:10px;align-items:center;font-family:var(--ui);font-size:12px;color:var(--muted);margin:-.2em 0 .9em}
.secbar button{border:1px solid var(--edge);background:transparent;border-radius:999px;padding:2px 11px;font-size:12px}
.secbar button:hover{background:var(--green-soft)}
.secbar button.done{background:var(--green);color:var(--panel);border-color:var(--green);font-weight:600}
:root[data-theme="dark"] .secbar button.done{color:#14120E}
.hlt{border-radius:2px;cursor:pointer;color:inherit;background:var(--hcol)}
.hc0{--hcol:var(--hc0)}.hc1{--hcol:var(--hc1)}.hc2{--hcol:var(--hc2)}.hc3{--hcol:var(--hc3)}
.bnote{font-family:var(--ui);margin:.6em 0 1em;border:1px solid var(--brown);border-left-width:4px;background:var(--brown-soft);border-radius:6px;padding:6px 10px 9px}
.bnote .bn-h{display:flex;justify-content:space-between;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--brown);margin-bottom:4px}
.bnote textarea{width:100%;min-height:64px;resize:vertical;font:15px/1.55 var(--ui);color:var(--ink);background:var(--panel);border:1px solid var(--edge);border-radius:6px;padding:8px 10px}
.bn-x{background:none;border:0;color:var(--muted);font-size:11px;padding:0;text-transform:none;letter-spacing:0}
.bn-x:hover{color:var(--maroon)}
#addnote{position:absolute;right:-8px;z-index:3;font:600 11px var(--ui);border:1px solid var(--edge);background:var(--panel);color:var(--muted);border-radius:999px;padding:2px 9px;display:none}
#addnote:hover{background:var(--brown-soft);color:var(--ink);border-color:var(--brown)}
.flash{animation:flash 1.8s ease-out}
@keyframes flash{0%,40%{background:var(--brown-soft)}100%{background:transparent}}
.hlpop{position:fixed;z-index:60;background:var(--panel);border:1px solid var(--edge);border-radius:999px;padding:6px 10px;display:flex;gap:6px;align-items:center;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.hlpop[hidden]{display:none}
.hlpop .sw{width:24px;height:24px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--edge);background:var(--hcol);padding:0}
.hlpop .pb{border:1px solid var(--edge);background:transparent;border-radius:999px;padding:3px 11px;font-weight:600;font-size:12px}
.hlpop .pb:hover{background:var(--brown-soft)}

/* chapter footer */
.cnav{max-width:70ch;margin:44px auto 0;display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:18px}
.btn{border:1px solid var(--edge);background:transparent;border-radius:8px;padding:8px 16px;font-weight:600}
.btn:hover{background:var(--green-soft)}
.btn.primary{background:var(--green);color:var(--panel);border-color:var(--green)}
:root[data-theme="dark"] .btn.primary{color:#14120E}
.btn.primary:hover{filter:brightness(1.1)}
.fallback img{width:100%;max-width:760px;display:block;margin:10px auto;border:1px solid var(--line)}
.loading{text-align:center;padding:60px 0;color:var(--muted)}

/* notes panel */
.nlist{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.nitem{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
.nitem:hover{border-color:var(--green)}
.nitem .nm{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--maroon);font-weight:600;display:flex;gap:6px;align-items:center}
.nitem p{margin:3px 0 0;font-size:12.5px;line-height:1.4;color:var(--ink)}
.nitem .q{color:var(--muted);font-family:var(--serif);font-style:italic}
.dotc{width:10px;height:10px;border-radius:50%;background:var(--hcol);display:inline-block}
.nh{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--brown);font-weight:600;margin:16px 2px 4px}

/* plan */
.plan{max-width:860px;margin:0 auto}
.plan h1{font-family:var(--display);font-size:30px;color:var(--maroon);margin:0 0 4px}
.pnext{background:var(--green);color:#F5F1E4;border-radius:10px;padding:18px 22px;margin:18px 0 8px}
:root[data-theme="dark"] .pnext{background:#26331F;color:var(--ink)}
.pnext .eyebrow{color:#D8E6C6}
.pnext h2{font-family:var(--display);font-size:22px;margin:4px 0 4px;color:inherit}
.pnext p{margin:8px 0 12px;max-width:62ch}
.pnext .btn{background:#F5F1E4;color:var(--green);border-color:#F5F1E4}
.pst{margin:30px 0 0}
.pst-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--green);padding-bottom:6px}
.pst-h h2{font-family:var(--display);font-size:20px;margin:0;color:var(--green)}
.pgrp{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--brown);font-weight:600;margin:16px 0 2px}
.prow{display:grid;grid-template-columns:28px 1fr auto;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:start}
.prow.done{opacity:.55}
.pn{font-family:ui-monospace,monospace;font-size:12px;color:var(--muted);padding-top:2px}
.ptitle{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.ptitle b{font-size:15px}
.bk{font-size:10.5px;font-weight:700;letter-spacing:.06em;border-radius:4px;padding:1px 6px;color:#fff}
.bk-cb{background:var(--green)}.bk-ln{background:var(--maroon)}
:root[data-theme="dark"] .bk{color:#14120E}
.pwhy{margin:4px 0 6px;color:var(--muted);max-width:60ch}
.prow .meter{max-width:240px;margin-top:6px}
.pact{text-align:right;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.pact .btn{padding:4px 14px}
.hide{display:inline-flex;gap:6px;align-items:center;margin-top:10px}
.how{margin-top:34px;background:var(--brown-soft);border-radius:8px;padding:12px 16px}
.how summary{cursor:pointer;font-weight:600;color:var(--brown)}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--panel);border-radius:999px;padding:8px 18px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s;z-index:80}
.toast.on{opacity:1}

@media (max-width:900px){
  #menu{display:inline-block}
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:54px;bottom:0;width:min(340px,88vw);height:auto;z-index:40;transform:translateX(-102%);transition:transform .2s}
  body.open .side{transform:none;box-shadow:4px 0 20px rgba(0,0,0,.2)}
  .main{padding:22px 16px 70px}
  .brand{display:none}
  .tab{padding:0 10px}
  .save{display:none}
}
@media (max-width:520px){.f{display:none}.sh2{display:inline}.bar{padding:0 10px;gap:8px}.tools{gap:4px}.tb{min-width:30px;padding:0 6px}.prow{grid-template-columns:22px 1fr}.pact{grid-column:2;flex-direction:row;align-items:center;justify-content:flex-start}}
</style>
</head>
<body>
<header class="bar">
  <button class="tb" id="menu" aria-label="Contents">☰</button>
  <div class="brand">Thesis Reading Room</div>
  <nav class="tabs" role="tablist" id="tabs">
    <button class="tab" role="tab" data-tab="plan">Plan</button>
    <button class="tab" role="tab" data-tab="cb"><span class="f">Complete Book</span><span class="sh2">Book</span></button>
    <button class="tab" role="tab" data-tab="ln"><span class="f">Lecture Notes</span><span class="sh2">Notes</span></button>
  </nav>
  <div class="tools">
    <span class="save" id="save">Saved in this browser</span>
    <button class="tb" id="zm" aria-label="Smaller text" title="Smaller text">A−</button>
    <button class="tb" id="zp" aria-label="Larger text" title="Larger text">A+</button>
    <button class="tb" id="theme" aria-label="Light or dark" title="Light or dark" style="font-size:12px">Dark</button>
  </div>
</header>
<div class="app" id="app">
  <aside class="side" id="side" aria-label="Contents"></aside>
  <main class="main" id="main"></main>
</div>
<div class="hlpop" id="hlpop" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="data/manifest.js"></script>
<script src="data/ln/manifest.js"></script>
<script>
(function(){
"use strict";
var BOOKS={

  ln:{k:"ln",name:"Lecture Notes",M:window.MANIFEST_LN,dir:"data/ln/",img:"img/ln/p",key:"ln-reading-v1",doc:"ln-reading",loaded:{},loading:{}}

Object.keys(BOOKS).forEach(function(k){var b=BOOKS[k];b.CHBY={};b.M.chapters.forEach(function(c){b.CHBY[c.n]=c;});});

function loadChapter(k,n,cb){

  if(U.io)U.io.disconnect();
  if("IntersectionObserver" in window){
    U.io=new IntersectionObserver(function(es){es.forEach(function(e){if(!e.isIntersecting)return;for(var i=0;i<D.s.length;i++){if(D.s[i][1]===e.target.id)onSec(n,i);}});},{rootMargin:"-8% 0px -85% 0px"});
    D.s.forEach(function(sp){var h=document.getElementById(sp[1]);if(h)U.io.observe(h);});
  }
}
function onSec(n,i){
  if(tab==="plan"||U.ch!==n)return;var D=CT()[n];
  if(U.curSec===i)return;
  if(S.set.auto&&U.curSec===i-1&&U.curSec>=0){var r=secRange(n,U.curSec);if(!rangeRead(r))markSpan(r[0],r[1],true);}
  U.curSec=i;S.last=D.s[i][0];save();refreshBars();
  var side=$("side");side.querySelectorAll(".sec").forEach(function(b,j){b.className="sec"+(j===i?" on":"");var ok=b.querySelector(".ok");if(ok)ok.textContent=rangeRead(secRange(n,j))?"✓":"";});
  var cp=side.querySelector(".ch.cur .cp");if(cp){var p=chPct(B.k,n);cp.textContent=p>=.999?"✓":(p>0?Math.round(p*100)+"%":"");}
}

/* ---------- highlights and notes ---------- */
function selSegs(range,root){var out=[];
  root.querySelectorAll("[data-b]").forEach(function(el){
    if(!range.intersectsNode(el))return;
    var br=document.createRange();br.selectNodeContents(el);var r=range.cloneRange();
    if(r.compareBoundaryPoints(Range.START_TO_START,br)<0)r.setStart(br.startContainer,br.startOffset);
    if(r.compareBoundaryPoints(Range.END_TO_END,br)>0)r.setEnd(br.endContainer,br.endOffset);
    var pre=document.createRange();pre.selectNodeContents(el);pre.setEnd(r.startContainer,r.startOffset);
    var a=pre.toString().length,t=r.toString();if(t.replace(/\s/g,"").length<1)return;
    out.push({key:U.rn+":"+el.getAttribute("data-b"),a:a,b:a+t.length,q:t.replace(/\s+/g," ").trim()});
  });return out;}
function addRead(c){
  var root=$("rdoc");if(!root||!U.rsel)return;
  U.rsel.forEach(function(sg){var m=U.blk[sg.key]||{};var rec={id:hid(),a:sg.a,b:sg.b,c:c,q:sg.q.slice(0,220),ts:Date.now(),s:m.s||"",p:m.p||S.last};
    (S.hb[sg.key]=S.hb[sg.key]||[]).push(rec);var el=root.querySelector('[data-b="'+sg.key.split(":")[1]+'"]');if(el)wrapRange(el,sg.a,sg.b,rec,sg.key);});
  U.rsel=null;save();if(U.panel==="notes")renderSide();
}
function rmRead(key,id){
  (S.hb[key]||[]).forEach(function(h){if(h.id===id){h.del=true;h.ts=Date.now();}});save();
  document.querySelectorAll('.hlt[data-hid="'+id+'"]').forEach(function(sp){var p=sp.parentNode;while(sp.firstChild)p.insertBefore(sp.firstChild,sp);p.removeChild(sp);p.normalize();});
  if(U.panel==="notes")renderSide();
}
function openNote(key){
  var root=$("rdoc");if(!root)return;var b=key.split(":")[1],el=root.querySelector('[data-b="'+b+'"]');if(!el)return;
  var nx=el.nextSibling,box=(nx&&nx.classList&&nx.classList.contains("bnote"))?nx:null;
  if(!box){box=noteBox(key,"");el.parentNode.insertBefore(box,el.nextSibling);}
  var ta=box.querySelector("textarea");ta.focus();box.scrollIntoView({block:"nearest"});
}
function openBlock(key){var n=+key.split(":")[0];U.panel=U.panel;U.ch=n;U.pend={block:key};document.body.classList.remove("open");showChapter(n);}
var bnT=null;
document.addEventListener("input",function(e){
  var t=e.target;if(!t.classList||!t.classList.contains("bn-t"))return;
  var box=t.closest(".bnote"),key=box.getAttribute("data-nk"),v=t.value,m=U.blk[key]||{};
  S.bn[key]={t:v.trim()?v:"",ts:Date.now(),s:m.s||(S.bn[key]&&S.bn[key].s)||"",p:m.p||(S.bn[key]&&S.bn[key].p)||S.last};
  clearTimeout(bnT);bnT=setTimeout(function(){save();if(U.panel==="notes")renderSide();},600);
});
document.addEventListener("mouseover",function(e){
  var an=$("addnote"),rd=$("rdoc");if(!an||!rd)return;
  var el=e.target.closest&&e.target.closest("[data-b]");if(!el||!rd.contains(el)||el.closest(".bnote"))return;
  an.style.top=(el.getBoundingClientRect().top-rd.getBoundingClientRect().top)+"px";an.style.display="block";an.setAttribute("data-key",U.rn+":"+el.getAttribute("data-b"));
});
document.addEventListener("mouseout",function(e){var an=$("addnote"),rd=$("rdoc");if(!an||!rd)return;if(!e.relatedTarget||!rd.contains(e.relatedTarget))an.style.display="none";});

function hidePop(){var e=$("hlpop");if(e)e.hidden=true;}
function showPop(x,y,html){var e=$("hlpop");e.innerHTML=html;e.hidden=false;var w=e.offsetWidth;e.style.left=Math.max(8,Math.min(window.innerWidth-w-8,x-w/2))+"px";e.style.top=Math.max(8,Math.min(window.innerHeight-48,y))+"px";}
function swHtml(){return [0,1,2,3].map(function(i){return '<button class="sw hc'+i+'" data-hlc="'+i+'" aria-label="Highlight in colour '+(i+1)+'"></button>';}).join("");}
var selT=null;
document.addEventListener("selectionchange",function(){clearTimeout(selT);selT=setTimeout(checkSel,350);});
function checkSel(){
  var sel=window.getSelection(),rdc=$("rdoc");
  if(!sel||sel.isCollapsed||!sel.rangeCount||!rdc){return;}
  var r=sel.getRangeAt(0);if(!rdc.contains(r.commonAncestorContainer))return;
  var cc=r.commonAncestorContainer,ce=cc.nodeType===1?cc:cc.parentNode;if(ce.closest&&ce.closest(".bnote,.secbar"))return;
  var sg=selSegs(r,rdc);if(!sg.length)return;U.rsel=sg;var rc=r.getBoundingClientRect();
  showPop(rc.left+rc.width/2,rc.bottom+8,swHtml()+'<button class="pb" data-rnote="1">✎ Note</button>');
}
document.addEventListener("mousedown",function(e){if(!e.target.closest(".hlpop"))hidePop();});
document.addEventListener("scroll",function(){var p=$("hlpop");if(p&&!p.hidden&&!(window.getSelection()&&!window.getSelection().isCollapsed))hidePop();},{passive:true});

function notesPanelHtml(){
  var k=B.k,keys=Object.keys(S.bn).filter(function(x){return S.bn[x].t;}),hls=[];
  Object.keys(S.hb).forEach(function(x){S.hb[x].forEach(function(h){if(!h.del)hls.push({k:x,h:h});});});
  function cmp(a,b){var x=a.split(":"),y=b.split(":");return (+x[0]-+y[0])||(+x[1]-+y[1]);}
  keys.sort(cmp);hls.sort(function(a,b){return cmp(a.k,b.k)||a.h.a-b.h.a;});
  var h='<div class="nh">Notes ('+keys.length+')</div><div class="nlist">';
  if(keys.length){keys.forEach(function(x){var r=S.bn[x];h+='<button class="nitem" data-bgo="'+x+'"><span class="nm">Ch. '+x.split(":")[0]+(r.s?' · '+esc(r.s.slice(0,40)):'')+'</span><p>'+esc(r.t.slice(0,160))+'</p></button>';});}
  else h+='<p class="muted" style="margin:4px 2px">Hover a paragraph and press ＋ Note, or select text and press Note.</p>';
  h+='</div><div class="nh">Highlights ('+hls.length+')</div><div class="nlist">';
  if(hls.length){hls.slice(0,300).forEach(function(x){h+='<button class="nitem" data-bgo="'+x.k+'"><span class="nm"><span class="dotc hc'+x.h.c+'"></span>Ch. '+x.k.split(":")[0]+'</span><p class="q">'+esc(x.h.q||"")+'</p></button>';});}
  else h+='<p class="muted" style="margin:4px 2px">Select text in a chapter and pick a colour.</p>';
  h+='</div>';
  if(keys.length||hls.length)h+='<div style="margin-top:14px"><button class="btn" data-copyall="1" style="width:100%">Copy notes and highlights</button></div>';
  return h;
}
function copyAll(){
  var out=[];function cmp(a,b){var x=a.split(":"),y=b.split(":");return (+x[0]-+y[0])||(+x[1]-+y[1]);}
  var items=[];Object.keys(S.bn).forEach(function(x){if(S.bn[x].t)items.push({k:x,t:"note",x:S.bn[x].t,s:S.bn[x].s,a:-1});});
  Object.keys(S.hb).forEach(function(x){S.hb[x].forEach(function(h){if(!h.del)items.push({k:x,t:"hl",x:h.q,s:h.s,a:h.a});});});
  items.sort(function(a,b){return cmp(a.k,b.k)||a.a-b.a;});
  var last="";items.forEach(function(it){var hd=B.name+", chapter "+it.k.split(":")[0]+(it.s?" - "+it.s:"");if(hd!==last){out.push("\n"+hd);last=hd;}out.push((it.t==="note"?"  NOTE: ":"  HIGHLIGHT: ")+it.x);});
  var txt=out.join("\n").trim(),ta=document.createElement("textarea");ta.value=txt;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();
  var ok=false;try{ok=document.execCommand("copy");}catch(e){}document.body.removeChild(ta);
  if(!ok&&navigator.clipboard){navigator.clipboard.writeText(txt).then(function(){toast("Copied");},function(){toast("Could not copy");});return;}
  toast(ok?"Copied":"Could not copy");
}

/* ---------- plan ---------- */
function planInfo(it){var k=it[0],b=BOOKS[k],c=b.CHBY[it[1]],pages=c.end-c.start+1,r=0,rd=ST[k].read;for(var p=c.start;p<=c.end;p++){if(rd[p])r++;}
  return {k:k,n:it[1],stage:it[2],grp:it[3],pace:it[4],title:it[5],why:it[6],c:c,pages:pages,read:r,hours:pages/it[4],ref:(k==="cb"?"CB ":"LN ")+it[1]};}
function renderPlan(){
  var its=PLAN.map(planInfo),tp0=0,tr0=0;its.forEach(function(x){tp0+=x.pages;tr0+=x.read;});
  var stages=[["Now","Step 1 · Start here","Estimation is your next thesis step. The Complete Book's Phase 4 builds System GMM from instruments up to Blundell–Bond and Roodman."],
   ["Next","Step 2 · Core chapters","Theory behind the model, capital adequacy and credit risk, climate stress testing, and the physical-risk component."],
   ["Later","Step 3 · Fill the gaps","Framing for the viva, climate economics, credit scoring, contagion, event studies and survey evidence."],
   ["Optional","Optional · Background","Overlapping or general background. Dip in only where a gap shows."]];
  var nx=null;its.forEach(function(x){if(!nx&&x.read<x.pages)nx=x;});
  var h='<div class="eyebrow">Reading order across both books</div><h1>Reading plan</h1><div class="muted">'+its.length+' chapters · about '+fmtH(its.reduce(function(a,x){return a+x.hours;},0))+' · '+Math.round(tr0/tp0*100)+'% read</div><div class="meter" style="margin-top:8px"><i style="width:'+(tr0/tp0*100)+'%"></i></div>';
  if(nx){h+='<div class="pnext"><div class="eyebrow">Up next</div><h2>'+esc(nx.ref+' · '+nx.title)+'</h2><div style="opacity:.85">pp. '+nx.c.start+'–'+nx.c.end+' · '+nx.pages+' pages · '+fmtH(nx.hours)+' at plan pace · '+nx.read+' read</div><p>'+esc(nx.why)+'</p><button class="btn" data-plango="'+nx.k+':'+nx.n+'">'+(nx.read?'Continue':'Start')+' reading</button></div>';}
  else h+='<div class="pnext"><h2>Plan finished</h2><p>Every chapter in the plan is marked read.</p></div>';
  h+='<label class="muted hide"><input type="checkbox" id="hd" '+(U.hideDone?'checked':'')+'> Hide finished chapters</label>';
  var seq=0;
  stages.forEach(function(sg){
    var list=its.filter(function(x){return x.stage===sg[0];});if(!list.length)return;
    var tp=0,tr=0,hh=0;list.forEach(function(x){tp+=x.pages;tr+=x.read;hh+=x.hours;});
    h+='<section class="pst"><div class="pst-h"><h2>'+sg[1]+'</h2><span class="muted">'+list.length+' chapters · '+tp+' pages · about '+fmtH(hh)+' · '+Math.round(tr/tp*100)+'% read</span></div><div class="muted" style="margin-top:6px">'+sg[2]+'</div>';
    var lastG=null;
    list.forEach(function(x){seq++;var done=x.read>=x.pages;if(U.hideDone&&done)return;
      if(x.grp!==lastG){h+='<div class="pgrp">'+esc(x.grp)+'</div>';lastG=x.grp;}
      var pc=Math.round(x.read/x.pages*100);
      h+='<div class="prow'+(done?' done':'')+'"><span class="pn">'+seq+'</span><div><div class="ptitle"><span class="bk bk-'+x.k+'">'+x.ref+'</span><b>'+esc(x.title)+'</b></div><div class="muted">pp. '+x.c.start+'–'+x.c.end+' · '+x.pages+' pages · '+fmtH(x.hours)+'</div><p class="pwhy">'+esc(x.why)+'</p><div class="meter"><i style="width:'+pc+'%"></i></div></div><div class="pact"><span class="muted">'+(done?'✓ Done':pc+'%')+'</span><button class="btn" data-plango="'+x.k+':'+x.n+'">'+(done?'Reread':(x.read?'Continue':'Read'))+'</button></div></div>';
    });
    h+='</section>';
  });
  h+='<details class="how"><summary>About overlaps and what is not in the plan</summary><p>Lecture Notes chapter 4 and Complete Book chapter 32 both cover the IRB formula, so read one in depth. Lecture Notes chapter 3 overlaps Complete Book chapters 14 to 18 on climate economics; the plan puts the Complete Book chapters first and keeps chapter 3 optional. Complete Book numbers are its own chapter numbers (1 to 42). Lecture Notes numbers follow its contents, so LN 2 is Layer 1 and LN 4 is Layer 3.</p></details>';
  $("plan").innerHTML=h;
}
function planGo(k,n){
  tab=k;ST.cb.set.tab=k;B=BOOKS[k];S=ST[k];ST.cb.set.book=k;U.ch=n;
  var go=function(){var D=CT()[n],sec=0;if(D){for(var i=0;i<D.s.length;i++){if(!rangeRead(secRange(n,i))){sec=i;break;}}}U.pend={sec:sec};if(sec>=0&&D&&D.s[sec])S.last=D.s[sec][0];save();renderTabs();$("app").className="app";applyTheme();renderSide();showChapter(n);};
  loadChapter(k,n,go);
}

/* ---------- events ---------- */
document.addEventListener("click",function(e){
  var t=e.target.closest?e.target.closest("[data-tab],[data-panel],[data-open],[data-sec],[data-secread],[data-chdone],[data-plango],[data-bgo],[data-nrm],[data-hlc],[data-rnote],[data-hbrm],[data-hnote],[data-copyall],#addnote,#zm,#zp,#theme,#menu,.hlt,#hd"):null;
  if(!t){return;}
  if(t.hasAttribute("data-tab")){setTab(t.getAttribute("data-tab"));return;}
  if(t.id==="menu"){document.body.classList.toggle("open");return;}
  if(t.id==="theme"){S.set.night=!S.set.night;ST.cb.set=S.set;linkSet();applyTheme();save();return;}
  if(t.id==="zm"||t.id==="zp"){var z=Math.round((S.set.zoom+(t.id==="zp"?.1:-.1))*10)/10;S.set.zoom=Math.max(.8,Math.min(1.6,z));var rd=$("rdoc");if(rd)rd.style.setProperty("--z",S.set.zoom);save();return;}
  if(t.id==="hd"){U.hideDone=t.checked;renderPlan();return;}
  if(t.hasAttribute("data-panel")){U.panel=t.getAttribute("data-panel");renderSide();return;}
  if(t.hasAttribute("data-plango")){var pr=t.getAttribute("data-plango").split(":");planGo(pr[0],+pr[1]);return;}
  if(t.hasAttribute("data-open")){
    var n=+t.getAttribute("data-open");
    if(t.hasAttribute("data-finish")){var fn=+t.getAttribute("data-finish");if(S.set.auto&&hasText(B.k,fn)&&chPct(B.k,fn)<.999){var c0=B.CHBY[fn];markSpan(c0.start,c0.end,true);toast("Chapter "+fn+" marked as read");}}
    var c=B.CHBY[n];if(c&&CT()[n]){}
    S.last=c.start;save();U.pend=null;document.body.classList.remove("open");window.scrollTo(0,0);showChapter(n);return;}
  if(t.hasAttribute("data-sec")){var i=+t.getAttribute("data-sec"),D=CT()[U.ch];if(D){var he=document.getElementById(D.s[i][1]);if(he)he.scrollIntoView({block:"start",behavior:"smooth"});}document.body.classList.remove("open");return;}
  if(t.hasAttribute("data-secread")){var si=+t.getAttribute("data-secread"),rg=secRange(U.rn,si),dn=rangeRead(rg);markSpan(rg[0],rg[1],!dn);save();refreshBars();renderSide();return;}
  if(t.hasAttribute("data-chdone")){var cn=+t.getAttribute("data-chdone"),c1=B.CHBY[cn],was=chPct(B.k,cn)>=.999;markSpan(c1.start,c1.end,!was);save();refreshBars();renderSide();t.textContent=was?"Mark chapter read":"✓ Chapter read";return;}
  if(t.hasAttribute("data-bgo")){openBlock(t.getAttribute("data-bgo"));return;}
  if(t.hasAttribute("data-copyall")){copyAll();return;}
  if(t.hasAttribute("data-hlc")){if(U.rsel){addRead(+t.getAttribute("data-hlc"));var s0=window.getSelection();if(s0)s0.removeAllRanges();hidePop();}return;}
  if(t.hasAttribute("data-rnote")){var sg0=U.rsel&&U.rsel[0];hidePop();var s1=window.getSelection();if(s1)s1.removeAllRanges();if(sg0)openNote(sg0.key);U.rsel=null;return;}
  if(t.hasAttribute("data-hbrm")){var pp=t.getAttribute("data-hbrm").split("|");rmRead(pp[0],pp[1]);hidePop();return;}
  if(t.hasAttribute("data-hnote")){hidePop();openNote(t.getAttribute("data-hnote"));return;}
  if(t.hasAttribute("data-nrm")){var nk=t.getAttribute("data-nrm");S.bn[nk]={t:"",ts:Date.now(),s:"",p:S.last};save();var nb=t.closest(".bnote");if(nb)nb.remove();if(U.panel==="notes")renderSide();return;}
  if(t.id==="addnote"){var ak=t.getAttribute("data-key");if(ak)openNote(ak);return;}
  if(t.classList&&t.classList.contains("hlt")){
    var sl=window.getSelection();if(sl&&!sl.isCollapsed)return;var rc=t.getBoundingClientRect(),hk=t.getAttribute("data-hk");
    showPop(e.clientX,rc.bottom+6,'<button class="pb" data-hbrm="'+hk+'|'+t.getAttribute("data-hid")+'">Remove highlight</button><button class="pb" data-hnote="'+hk+'">✎ Note</button>');return;}
});

/* ---------- boot ---------- */
Object.keys(BOOKS).forEach(function(k){ST[k]=normalize(localLoad(BOOKS[k]));});
linkSet();
(function(){var t=ST.cb.set.tab;if(t==="cb"||t==="ln"){tab=t;B=BOOKS[t];}else if(ST.cb.set.book==="ln"&&false){} S=ST[B.k];})();
S=ST[B.k];
if(tab!=="plan"){U.pend={resume:true};}
renderAll();
initCloud();
})();
</script>
