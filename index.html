<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thesis Reading Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
/* Layout idea: dashboard strip on top, then contents rail | page reader | study panel. Navy and teal match the Excel dashboard. */
:root{
  --bg:#F3F5F9; --panel:#FFFFFF; --ink:#1F2A44; --muted:#5B6780; --line:#DCE1EA; --soft:#EAF0F6;
  --accent:#0E9AA7; --accent-ink:#FFFFFF; --accent-soft:#D9F0F2;
  --good:#2E8B62; --good-soft:#DDF1E6; --warn:#B57A00; --warn-soft:#FBEBC8; --bad:#B5362A; --bad-soft:#F8DAD6;
  --ui:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --serif:'Source Serif 4',Georgia,serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
  --shadow:0 1px 2px rgba(31,42,68,.06),0 4px 14px rgba(31,42,68,.05);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1524; --panel:#162033; --ink:#E6ECF6; --muted:#98A5BE; --line:#27324D; --soft:#1C2740;
    --accent:#3BC3CF; --accent-ink:#06222A; --accent-soft:#16363F;
    --good:#58C493; --good-soft:#173A2C; --warn:#F2B84B; --warn-soft:#3E3217; --bad:#EF7D70; --bad-soft:#47201C;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 4px 14px rgba(0,0,0,.25); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1524; --panel:#162033; --ink:#E6ECF6; --muted:#98A5BE; --line:#27324D; --soft:#1C2740;
  --accent:#3BC3CF; --accent-ink:#06222A; --accent-soft:#16363F;
  --good:#58C493; --good-soft:#173A2C; --warn:#F2B84B; --warn-soft:#3E3217; --bad:#EF7D70; --bad-soft:#47201C;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 4px 14px rgba(0,0,0,.25); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:14px;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1560px;margin:0 auto;padding:16px}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.num{font-variant-numeric:tabular-nums}

/* top dashboard */
.top{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:16px;display:grid;gap:14px}
.top-head{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}
.top-head h1{font-size:22px}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px;font-weight:500}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.primary:hover{filter:brightness(.95)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.save{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.save i{width:8px;height:8px;border-radius:50%;background:var(--warn);display:inline-block}
.save.acc i{background:var(--good)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--soft);border-radius:10px;padding:10px 12px;display:grid;gap:2px;align-content:start}
.tile b{font-size:24px;font-weight:600;line-height:1.1}
.tile small{color:var(--muted);font-size:12px}
.ringtile{display:flex;gap:12px;align-items:center}
.ring{width:72px;height:72px;flex:none}
.ring circle{fill:none;stroke-width:8}
.ring .bg{stroke:var(--line)} .ring .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .4s}
.ring text{font:600 16px var(--ui);fill:var(--ink)}
.bars7{display:flex;gap:3px;align-items:flex-end;height:26px;margin-top:4px}
.bars7 span{flex:1;background:var(--accent);opacity:.85;border-radius:2px;min-height:2px}
.bars7 span.z{background:var(--line);opacity:1}
.strip{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
.phs{grid-template-columns:repeat(6,minmax(0,1fr));margin-bottom:6px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 8px;text-align:left;display:grid;gap:4px}
.chip:hover{border-color:var(--accent)}
.chip.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.chip .t{display:flex;justify-content:space-between;font-size:12px;font-weight:600}
.chip .t span:last-child{color:var(--muted);font-weight:500}
.meter{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .3s}
.meter.amber i{background:#E5A82B}
.how{font-size:13px;color:var(--muted)}
.how summary{cursor:pointer;color:var(--ink);font-weight:500}
.how p{margin:6px 0 0;max-width:90ch}

/* three columns */
.cols{display:grid;grid-template-columns:290px minmax(0,1fr) 360px;gap:14px;margin-top:14px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.rail,.side{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
.rail{padding:12px}
.rail h2,.side h2{font-size:15px}
.chap{border-top:1px solid var(--line);padding:8px 0}
.chap:first-of-type{border-top:0}
.chap-h{width:100%;background:none;border:0;text-align:left;padding:2px 0;display:grid;gap:5px}
.chap-h .l1{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.chap-h .l1 span:last-child{color:var(--muted);font-weight:500;font-size:12px;white-space:nowrap}
.chap-h .l2{font-size:12px;color:var(--muted)}
.secs{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:1px}
.sec{width:100%;background:none;border:0;border-radius:6px;padding:4px 6px;text-align:left;display:grid;grid-template-columns:14px 1fr auto;gap:8px;align-items:start;font-size:13px}
.sec:hover{background:var(--soft)}
.sec.here{background:var(--accent-soft)}
.dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--line);margin-top:3px}
.dot.part{border-color:var(--accent);background:linear-gradient(90deg,var(--accent) 50%,transparent 50%)}
.dot.done{border-color:var(--accent);background:var(--accent)}
.sec .pg{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:2px}

/* reader */
.reader{min-width:0}
.bar{position:sticky;top:0;z-index:5;background:var(--panel);border:1px solid var(--line);border-radius:14px 14px 0 0;padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:6px 11px;font-weight:500}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.pager{display:inline-flex;align-items:center;gap:6px}
.pager input{width:58px;text-align:center;border:1px solid var(--line);border-radius:6px;padding:5px;background:var(--panel);color:var(--ink);font:500 13px var(--mono)}
.sp{flex:1}
.where{padding:10px 14px;border:1px solid var(--line);border-top:0;background:var(--panel);display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.where b{font-weight:600}
.pill{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--ink)}
.pill.read{background:var(--good-soft);color:var(--good);font-weight:600}
.pill.mute{color:var(--muted)}
.stage{border:1px solid var(--line);border-top:0;border-radius:0 0 14px 14px;background:var(--panel);padding:14px}
.stage.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
.pagebox{overflow:auto;text-align:center;background:var(--soft);border-radius:10px;padding:10px}
.pagebox img{display:block;margin:0 auto;max-width:none;height:auto;border-radius:3px;box-shadow:0 2px 12px rgba(0,0,0,.18);background:#fff}
.pagebox.night img{filter:invert(.9) hue-rotate(180deg)}
.textbox{font-family:var(--serif);font-size:16.5px;line-height:1.6;max-width:72ch;margin:0 auto;white-space:pre-line;overflow-wrap:anywhere}
.textbox .h{font-family:var(--ui);font-weight:600;font-size:15px;display:inline-block;margin-top:4px}
.textbox mark{background:#FFE08A;color:#1F2A44;border-radius:2px}
.warnnote{font-size:12.5px;color:var(--warn);background:var(--warn-soft);border-radius:8px;padding:6px 10px;margin:0 0 12px}
.stage.two .textbox{font-size:15px}
.stage.two .textbox{max-height:80vh;overflow:auto;padding-right:6px}
.foot{display:flex;justify-content:space-between;gap:8px;margin-top:12px;flex-wrap:wrap}

/* side panel */
.side{padding:0}
.tabs{display:flex;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2;border-radius:14px 14px 0 0}
.tabs button{flex:1;background:none;border:0;padding:11px 6px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.pane{padding:14px;display:grid;gap:12px}
textarea{width:100%;min-height:150px;resize:vertical;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--panel);color:var(--ink);font:15px/1.5 var(--serif)}
input[type="search"]{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:var(--panel);color:var(--ink);font:inherit}
.list{display:grid;gap:6px}
.item{width:100%;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 10px;display:grid;gap:3px}
.item:hover{border-color:var(--accent)}
.item .m{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.item .m b{font-family:var(--mono);color:var(--ink)}
.item p{margin:0;font-size:13px;overflow-wrap:anywhere}
.item mark{background:#FFE08A;color:#1F2A44}
.qcard{border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px;background:var(--panel)}
.qcard .q{font-family:var(--serif);font-size:17px;line-height:1.5;overflow-wrap:anywhere}
.qcard .a{font-family:var(--serif);font-size:15.5px;line-height:1.55;background:var(--soft);border-radius:8px;padding:10px 12px;overflow-wrap:anywhere}
.lv{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--ink)}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.rate button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 4px;font-weight:600}
.rate .r0:hover{background:var(--bad-soft)} .rate .r1:hover{background:var(--warn-soft)} .rate .r2:hover{background:var(--good-soft)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.qd{width:30px;height:26px;border-radius:6px;border:1px solid var(--line);background:var(--panel);font:600 11px var(--mono)}
.qd.m0{background:var(--bad-soft);border-color:var(--bad)} .qd.m1{background:var(--warn-soft);border-color:var(--warn)} .qd.m2{background:var(--good-soft);border-color:var(--good)}
.qd.cur{outline:2px solid var(--accent);outline-offset:1px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted);font-size:12.5px}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
.toast.on{opacity:1}
.railbtn{display:none}

@media (max-width:1180px){
  .cols{grid-template-columns:minmax(0,1fr) 340px}
  .rail{position:static;max-height:none;grid-column:1 / -1;order:3}
  .rail .chaps{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:0 18px}
}
@media (max-width:860px){
  .cols{grid-template-columns:minmax(0,1fr)}
  .side{position:static;max-height:none}
  .strip{grid-template-columns:repeat(4,minmax(0,1fr))}.phs{grid-template-columns:repeat(3,minmax(0,1fr))}
  .stage.two{grid-template-columns:minmax(0,1fr)}
  .bar{position:static}
}
@media (max-width:480px){.wrap{padding:10px}.strip{grid-template-columns:repeat(2,minmax(0,1fr))}.seg button{padding:6px 8px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <section class="top" id="top" aria-label="Reading progress"></section>
  <div class="cols">
    <aside class="card rail" id="rail" aria-label="Contents"></aside>
    <main class="reader" id="reader"></main>
    <aside class="card side" id="side" aria-label="Study tools"></aside>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="data/manifest.js"></script>
<script>
(function(){
"use strict";
var M=window.MANIFEST, PH=M.phases, CHALL=M.chapters;
var PAGES=[],CH=[],CARDS=[],FIRST=1,LAST=1,CUR=1,BYP={},CHBY={};
CHALL.forEach(function(c){CHBY[c.n]=c;});
var KEY="book-reading-v1", OLDKEY="phase4-reading-v1";
function phaseOf(p){for(var i=0;i<PH.length;i++){if(p>=PH[i].start&&p<=PH[i].end)return PH[i].n;}return 1;}
var loadedPh={};
function ensurePhase(n,cb){
  if(window.PHASE_DATA&&window.PHASE_DATA[n]){cb();return;}
  if(loadedPh[n]){loadedPh[n].push(cb);return;}
  loadedPh[n]=[cb];
  var sc=document.createElement("script");sc.src="data/phase"+n+".js";
  sc.onload=function(){var q=loadedPh[n];loadedPh[n]=null;q.forEach(function(f){f();});};
  sc.onerror=function(){loadedPh[n]=null;toast("Could not load Phase "+n+". Check your connection and try again.");};
  document.head.appendChild(sc);
}
function applyPhase(n){
  var ph=PH[n-1],D=window.PHASE_DATA[n];CUR=n;PAGES=D.pages;CARDS=D.cards;
  CH=CHALL.filter(function(c){return c.phase===n;});FIRST=ph.start;LAST=ph.end;
  BYP={};PAGES.forEach(function(p){BYP[p.printed]=p;});
}
function phasePct(n){var ph=PH[n-1],r=0,t=ph.end-ph.start+1;for(var p=ph.start;p<=ph.end;p++){if(S.read[p])r++;}return t?r/t:0;}
function resumeOf(n){var ph=PH[n-1];for(var p=ph.start;p<=ph.end;p++){if(!S.read[p])return p;}return ph.start;}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function $(id){return document.getElementById(id);}
function today(){return new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);}

/* ---------- state ---------- */
var S={v:1,read:{},notes:{},marks:{},bm:[],mins:{},last:1,set:{auto:true,view:"page",zoom:1,night:false}};
var U={sw:false,tab:"notes",q:"",qi:0,qf:"all",reveal:false,open:{},qmode:"quiz"};
var ref=null, saveT=null, status="local";
function normalize(d){
  d=d||{}; var o={v:1,read:d.read||{},notes:d.notes||{},marks:d.marks||{},bm:d.bm||[],mins:d.mins||{},last:d.last||1,set:Object.assign({auto:true,view:"page",zoom:1,night:false},d.set||{})};
  return o;
}
function localLoad(){try{var t=localStorage.getItem(KEY)||localStorage.getItem(OLDKEY);return t?JSON.parse(t):null;}catch(e){return null;}}
function localSave(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function merge(a,b){ /* a = local, b = cloud: keep newest per item */
  var o=normalize(a);
  Object.keys(b.read||{}).forEach(function(k){o.read[k]=Math.max(o.read[k]||0,b.read[k]);});
  Object.keys(b.notes||{}).forEach(function(k){var x=o.notes[k],y=b.notes[k]; if(!x||(y&&y.ts>x.ts))o.notes[k]=y;});
  Object.keys(b.marks||{}).forEach(function(k){var x=o.marks[k],y=b.marks[k]; if(!x||(y&&y.ts>x.ts))o.marks[k]=y;});
  (b.bm||[]).forEach(function(p){if(o.bm.indexOf(p)<0)o.bm.push(p);});
  Object.keys(b.mins||{}).forEach(function(k){o.mins[k]=Math.max(o.mins[k]||0,b.mins[k]);});
  if(!Object.keys(a.read||{}).length&&b.last)o.last=b.last;
  return o;
}
function setStatus(s){status=s;var e=$("savetxt");if(e){e.textContent=s==="account"?"Saved to your account":s==="saving"?"Saving…":"Saved in this browser (use Export to back up)";e.parentNode.className="save "+(s==="account"?"acc":"");}}
function save(){localSave(); if(saveT)clearTimeout(saveT); saveT=setTimeout(function(){
  if(!ref)return; setStatus("saving");
  Promise.resolve().then(function(){return ref.set(JSON.parse(JSON.stringify(S)));}).then(function(){setStatus("account");}).catch(function(){setStatus("local");});
},1500);}
function unwrap(snap){ if(!snap)return null; try{ if(typeof snap.exists==="function"&&!snap.exists())return null; if(snap.exists===false)return null; if(typeof snap.data==="function")return snap.data(); if(snap.data!==undefined)return snap.data; }catch(e){} return snap; }
function initCloud(){
  if(!window.claude||!window.claude.use)return;
  Promise.all([window.claude.use("user"),window.claude.use("db")]).then(function(r){
    var user=r[0],db=r[1]; if(!user||!db||!user.id)return;
    return Promise.resolve(user.id()).then(function(id){
      if(!id)return; var rr=db.collection("data/users/"+id).doc("book-reading"),lg=db.collection("data/users/"+id).doc("phase4-reading");
      var t=new Promise(function(_,rej){setTimeout(function(){rej(new Error("timeout"));},10000);});
      return Promise.race([Promise.all([rr.get(),lg.get().catch(function(){return null;})]),t]).then(function(sn){
        var d=unwrap(sn[0]),d0=unwrap(sn[1]); if(d0&&d0.v===1){S=merge(S,d0);} if(d&&d.v===1){S=merge(S,d);} ref=rr; localSave(); setStatus("account"); renderAll(); save();
      });
    });
  }).catch(function(){ref=null;setStatus("local");});
}

/* ---------- derived numbers ---------- */
function isRead(p){return !!S.read[p];}
function chRead(c){var ch=CHBY[c],n=0;for(var p=ch.start;p<=ch.end;p++){if(isRead(p))n++;}return n;}
function chOf(printed){for(var i=0;i<CHALL.length;i++){if(printed>=CHALL[i].start&&printed<=CHALL[i].end)return CHALL[i].n;}return 0;}
function secSpan(c,i){var ch=CHBY[c],s=ch.sections,a=s[i].page,b=(i+1<s.length)?s[i+1].page:ch.end+1; if(b<=a)b=a+1; return [a,Math.min(b-1,ch.end)];}
function secPct(c,i){var sp=secSpan(c,i),n=0,r=0;for(var p=sp[0];p<=sp[1];p++){n++;if(isRead(p))r++;}return n?r/n:0;}
function totalRead(){return PAGES.filter(function(p){return isRead(p.printed);}).length;}
function hoursLeft(){var h=0;PAGES.forEach(function(p){if(!isRead(p.printed)&&p.ch){var c=CHBY[p.ch];h+=c.hours/(c.end-c.start+1);}});return h;}
function hoursTotal(){return CH.reduce(function(a,c){return a+c.hours;},0);}
function cardsOf(c){return CARDS.filter(function(x){return x.ch===c;});}
function mval(id){var m=S.marks[id];return m?m.v:-1;}
function mastery(list){if(!list.length)return 0;var t=0;list.forEach(function(x){var v=mval(x.id);if(v===2)t+=1;else if(v===1)t+=.5;});return t/list.length;}
function rated(list){return list.filter(function(x){return mval(x.id)>=0;}).length;}
function fmtH(h){return h<1?Math.round(h*60)+" min":h.toFixed(1)+" h";}
function lastDays(n){var o=[];for(var i=n-1;i>=0;i--){var d=new Date(Date.now()-new Date().getTimezoneOffset()*60000-i*864e5).toISOString().slice(0,10);o.push([d,S.mins[d]||0]);}return o;}

/* ---------- navigation ---------- */
function go(p,opts){p=Math.max(1,Math.min(M.last,p));var n=phaseOf(p);
  var fin=function(){if(n!==CUR){applyPhase(n);U.qi=0;U.reveal=false;U.qf="all";}S.last=p;U.open[chOf(p)]=true;save();renderAll();if(!opts||!opts.noScroll){var r=$("reader");if(r&&r.getBoundingClientRect().top<0)r.scrollIntoView({block:"start"});}};
  if(n!==CUR)ensurePhase(n,fin);else fin();}
function mark(p,on){if(on)S.read[p]=Date.now();else delete S.read[p];save();}
function next(){var p=S.last;if(S.set.auto&&!isRead(p)){mark(p,true);toast("Marked p. "+p+" as read");}go(p+1);}
function prev(){go(S.last-1);}
function toast(t){var e=$("toast");e.textContent=t;e.className="toast on";clearTimeout(toast.t);toast.t=setTimeout(function(){e.className="toast";},1600);}

/* ---------- render: reader ---------- */
function sectionsOn(printed){
  var ch=CHBY[chOf(printed)]; if(!ch)return {carry:null,start:[]};
  var carry=null,start=[]; ch.sections.forEach(function(s){ if(s.page<printed)carry=s; else if(s.page===printed)start.push(s);});
  return {carry:carry,start:start};
}
function hl(text,q){
  var t=esc(text); if(!q)return t;
  q.split(/\s+/).filter(function(w){return w.length>1;}).forEach(function(w){var re=new RegExp("("+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi");t=t.replace(re,"<mark>$1</mark>");});
  return t;
}
function textHtml(pg){
  var lines=pg.text.split("\n"), out=[];
  lines.forEach(function(l){
    var m=/^(\d+\.\d+\s+)(.*)$/.exec(l);
    if(m&&/^[A-Z]/.test(m[2])&&l.length<90)out.push('<span class="h">'+hl(l,U.q)+'</span>'); else out.push(hl(l,U.q));
  });
  return out.join("\n");
}

  var txt='<div><p class="warnnote">Text view is machine-extracted. Equations, tables and figures can be garbled, so use Page view for anything mathematical.</p><div class="textbox" id="tb">'+textHtml(pg)+'</div></div>';
  var stage = v==="page"?img : v==="text"?txt : (wide? '<div class="stage two" style="padding:0;border:0">'+img+txt+'</div>' : img);
  var inner = v==="split"&&wide ? stage : stage;
  $("reader").innerHTML=
   '<div class="bar"><div class="seg" role="group" aria-label="View"><button data-view="page" aria-pressed="'+(v==="page")+'">Page</button><button data-view="text" aria-pressed="'+(v==="text")+'">Text</button><button data-view="split" aria-pressed="'+(v==="split")+'">Split</button></div>'+

  var h='<div class="tabs" role="tablist">'+tabs.map(function(x){return '<button role="tab" data-tab="'+x[0]+'" aria-selected="'+(t===x[0])+'">'+x[1]+'</button>';}).join("")+'</div><div class="pane">';
  if(t==="notes"){
    var p=S.last,n=S.notes[p];
    h+='<div><div class="eyebrow">Note for page '+p+'</div></div><textarea id="note" placeholder="Key ideas, formulas to remember, questions for your supervisor" aria-label="Note for this page">'+esc(n?n.t:"")+'</textarea><div class="muted">Saved as you type.</div>';
    var ks=Object.keys(S.notes).filter(function(k){return S.notes[k].t;}).map(Number).sort(function(a,b){return a-b;});
    h+='<div id="notelist"><div class="eyebrow">All notes ('+ks.length+')</div><div class="list">'+(ks.length?ks.map(function(k){return '<button class="item" data-go="'+k+'"><span class="m"><b>p. '+k+'</b><span>Ch. '+chOf(k)+'</span></span><p>'+esc(S.notes[k].t.slice(0,140))+'</p></button>';}).join(""):'<p class="muted">No notes yet. Notes you write on a page show up here.</p>')+'</div></div>';

    if(U.q.trim().length>1){
      var terms=U.q.toLowerCase().split(/\s+/).filter(Boolean),res=[];
      var pool=U.sw?allPages():PAGES;
      pool.forEach(function(pg){var low=pg.text.toLowerCase();if(terms.every(function(w){return low.indexOf(w)>=0;})){var i=low.indexOf(terms[0]);var a=Math.max(0,i-50),b=Math.min(pg.text.length,i+90);res.push({p:pg.printed,s:(a>0?"…":"")+pg.text.slice(a,b).replace(/\s+/g," ")+(b<pg.text.length?"…":"")});}});
      h+='<div class="muted">'+res.length+' page'+(res.length===1?'':'s')+' match. Equations are not searchable because their text is garbled.</div><div class="list">'+res.slice(0,40).map(function(r){return '<button class="item" data-go="'+r.p+'" data-text="1"><span class="m"><b>p. '+r.p+'</b><span>Ch. '+chOf(r.p)+'</span></span><p>'+hl(r.s,U.q)+'</p></button>';}).join("")+'</div>';
    } else h+='<p class="muted">Type two or more letters. Results open that page and highlight the words in Text view.</p>';
  } else {
    var bms=S.bm.slice().sort(function(a,b){return a-b;});
    h+='<div class="eyebrow">Bookmarks ('+bms.length+')</div><div class="list">'+(bms.length?bms.map(function(k){var s=sectionsOn(k),lab=s.start[0]||s.carry;return '<button class="item" data-go="'+k+'"><span class="m"><b>p. '+k+'</b><span>Ch. '+chOf(k)+'</span></span><p>'+esc(lab?(lab.num?lab.num+' ':'')+lab.title:'Phase '+CUR+' opener')+'</p></button>';}).join(""):'<p class="muted">Use \u2606 Bookmark in the page toolbar to save a place.</p>')+'</div>';
    var rs=Object.keys(S.read).map(Number).sort(function(a,b){return S.read[b]-S.read[a];}).slice(0,8);
    h+='<div class="eyebrow">Recently read</div><div class="list">'+(rs.length?rs.map(function(k){return '<button class="item" data-go="'+k+'"><span class="m"><b>p. '+k+'</b><span>'+new Date(S.read[k]).toLocaleDateString(undefined,{day:"numeric",month:"short"})+'</span></span></button>';}).join(""):'<p class="muted">Pages you mark as read appear here.</p>')+'</div>';
  }

function allPages(){var a=[];for(var n=1;n<=PH.length;n++){if(window.PHASE_DATA&&window.PHASE_DATA[n])a=a.concat(window.PHASE_DATA[n].pages);}return a;}

function curChap(){var c=chOf(S.last);return c||CH[0].n;}
function deck(){var c=curChap(),l=cardsOf(c);if(U.qf==="todo")l=l.filter(function(x){return mval(x.id)!==2;});else if(U.qf!=="all")l=l.filter(function(x){return x.lv===U.qf;});return l;}

/* ---------- wiring ---------- */
function renderAll(){renderTop();renderRail();renderReader();renderSide();}
function applyTheme(){var t=window.__theme;if(t)document.documentElement.setAttribute("data-theme",t);}
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-go],[data-phase],[data-tog],[data-view],[data-tab],[data-rate],[data-qid],button,#theme");if(!t)return;
  if(t.hasAttribute("data-go")){var p=+t.getAttribute("data-go");if(t.hasAttribute("data-text"))S.set.view=S.set.view==="page"?"text":S.set.view;if(t.hasAttribute("data-page"))S.set.view="page";go(p);return;}
  if(t.hasAttribute("data-phase")){go(resumeOf(+t.getAttribute("data-phase")));return;}
  if(t.hasAttribute("data-tog")){var c=+t.getAttribute("data-tog");var cur=U.open[c]===undefined?(chOf(S.last)===c):U.open[c];U.open[c]=!cur;renderRail();return;}
  if(t.hasAttribute("data-view")){S.set.view=t.getAttribute("data-view");save();renderReader();return;}
  if(t.hasAttribute("data-tab")){U.tab=t.getAttribute("data-tab");renderSide();return;}
  if(t.hasAttribute("data-rate")){var q=deck()[U.qi];if(q){S.marks[q.id]={v:+t.getAttribute("data-rate"),ts:Date.now()};save();U.reveal=false;var d=deck();U.qi=Math.min(U.qi+1,Math.max(0,d.length-1));renderTop();renderRail();renderSide();}return;}
  if(t.hasAttribute("data-qid")){var d2=deck(),i=d2.map(function(x){return x.id;}).indexOf(t.getAttribute("data-qid"));if(i<0){U.qf="all";d2=deck();i=d2.map(function(x){return x.id;}).indexOf(t.getAttribute("data-qid"));}U.qi=Math.max(0,i);U.reveal=false;renderSide();return;}
  var id=t.id;
  if(id==="exp"){var b=new Blob([JSON.stringify(S,null,1)],{type:"application/json"});var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="phase4-progress-"+new Date().toISOString().slice(0,10)+".json";a.click();return;}
  if(id==="imp"){$("impf").click();return;}
  if(id==="theme"){var cur2=document.documentElement.getAttribute("data-theme");var dark=cur2?cur2==="dark":window.matchMedia("(prefers-color-scheme:dark)").matches;document.documentElement.setAttribute("data-theme",dark?"light":"dark");return;}
  if(id==="nx"||id==="nx2")return next();

  if(id==="zi"){S.set.zoom=Math.min(2,Math.round((S.set.zoom+.25)*100)/100);save();renderReader();return;}
  if(id==="zo"){S.set.zoom=Math.max(.5,Math.round((S.set.zoom-.25)*100)/100);save();renderReader();return;}
  if(id==="night"){S.set.night=!S.set.night;save();renderReader();return;}
  if(id==="bm"){var i2=S.bm.indexOf(S.last);if(i2>=0)S.bm.splice(i2,1);else S.bm.push(S.last);save();renderReader();renderSide();return;}
  if(id==="rd"){mark(S.last,!isRead(S.last));renderTop();renderRail();renderReader();return;}
  if(id==="rev"){U.reveal=true;renderSide();return;}
  if(id==="qn"||id==="qp"){var n=deck().length;U.qi=(U.qi+(id==="qn"?1:-1)+n)%n;U.reveal=false;renderSide();return;}
});

  var t=e.target;
  if(t.id==="sw"){U.sw=t.checked;if(U.sw){var miss=[];for(var n=1;n<=PH.length;n++){if(!(window.PHASE_DATA&&window.PHASE_DATA[n]))miss.push(n);}var left=miss.length;if(!left){renderSide();}else{toast("Loading all phases for search…");miss.forEach(function(n){ensurePhase(n,function(){if(--left===0)renderSide();});});}}else renderSide();}
  else if(t.id==="auto"){S.set.auto=t.checked;save();renderReader();}
  else if(t.id==="pj"){var v=parseInt(t.value,10);if(isFinite(v))go(v,{noScroll:true});else t.value=S.last;}
  else if(t.id==="qf"){U.qf=t.value;U.qi=0;U.reveal=false;renderSide();}
});
var noteT=null;
document.addEventListener("input",function(e){
  var t=e.target;
  if(t.id==="note"){var p=S.last,v=t.value;if(v.trim())S.notes[p]={t:v,ts:Date.now()};else delete S.notes[p];clearTimeout(noteT);noteT=setTimeout(function(){save();var nl=$("notelist");if(nl){var tmp=document.createElement("div");tmp.innerHTML=notesListHtml();nl.innerHTML=tmp.firstChild.innerHTML;}},400);}
  else if(t.id==="q"){U.q=t.value;var pos=t.selectionStart;renderSide();var n=$("q");if(n){n.focus();n.setSelectionRange(pos,pos);}renderReader();}
});
document.addEventListener("keydown",function(e){
  var tg=e.target&&e.target.tagName; if(tg==="INPUT"||tg==="TEXTAREA"||tg==="SELECT")return; if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==="ArrowRight"){e.preventDefault();next();}
  else if(e.key==="ArrowLeft"){e.preventDefault();prev();}
  else if(e.key==="m"){mark(S.last,!isRead(S.last));renderTop();renderRail();renderReader();}
  else if(e.key==="t"){S.set.view=S.set.view==="page"?"text":"page";save();renderReader();}
  else if(e.key==="b"){var i=S.bm.indexOf(S.last);if(i>=0)S.bm.splice(i,1);else S.bm.push(S.last);save();renderReader();renderSide();}
  else if(U.tab==="check"){
    if(e.key===" "&&!U.reveal&&deck().length){e.preventDefault();U.reveal=true;renderSide();}
    else if(U.reveal&&(e.key==="1"||e.key==="2"||e.key==="3")){var q=deck()[U.qi];if(q){S.marks[q.id]={v:+e.key-1,ts:Date.now()};save();U.reveal=false;var d=deck();U.qi=Math.min(U.qi+1,Math.max(0,d.length-1));renderTop();renderRail();renderSide();}}
  }
});
/* reading timer: counts only while visible and recently active */
var lastAct=Date.now();
["pointerdown","keydown","scroll","touchstart","mousemove"].forEach(function(ev){window.addEventListener(ev,function(){lastAct=Date.now();},{passive:true});});
setInterval(function(){
  if(document.visibilityState!=="visible"||Date.now()-lastAct>90000)return;
  var k=today();S.mins[k]=Math.round(((S.mins[k]||0)+0.25)*100)/100;save();
  if(Math.round(S.mins[k]*4)%4===0)renderTop();
},15000);
var rt=null;window.addEventListener("resize",function(){clearTimeout(rt);rt=setTimeout(renderReader,150);});

/* boot */
document.addEventListener("change",function(e){if(e.target.id!=="impf")return;var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{S=merge(S,normalize(JSON.parse(r.result)));save();renderAll();alert("Progress imported and merged.");}catch(x){alert("That file could not be read.");}};r.readAsText(f);});
(function(){var l=localLoad();if(l)S=normalize(l);var n=phaseOf(S.last);ensurePhase(n,function(){applyPhase(n);U.open[chOf(S.last)]=true;renderAll();initCloud();});})();
})();
</script>
</body>
