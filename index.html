<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thesis Reading Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,400..700,100,1&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
/* Layout: dashboard on top, contents strip, full-width reader, then study tools below. Colour-coded phases on a cool paper background. */
:root{
  --bg:#ECEEFB; --panel:#FFFFFF; --ink:#241B3B; --muted:#6B6688; --line:#DADCF0; --soft:#F1F2FC; --edge:#BFC3E6;
  --accent:#8E1B3A; --accent-ink:#FFFFFF; --accent-soft:color-mix(in srgb,var(--accent) 14%,var(--panel));
  --gold:#F2B134; --gold-soft:#FFEFB8;
  --good:#1F8A5B; --good-soft:#D9F2E5; --warn:#9A6A12; --warn-soft:#FFF0C2; --bad:#B8322A; --bad-soft:#FADBD6;
  --ui:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --serif:'Source Serif 4',Georgia,serif; --mono:'IBM Plex Mono',ui-monospace,monospace; --display:'Fraunces','Source Serif 4',Georgia,serif;
  --shadow:3px 3px 0 #D3D6F2; --shadow-a:2px 2px 0 rgba(36,27,59,.85); --dots:rgba(106,79,214,.12);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#16122A; --panel:#211A3A; --ink:#F2EEFF; --muted:#B6AED6; --line:#352C5C; --soft:#2A2247; --edge:#4A3F7A;
    --accent-ink:#1B1230; --gold:#F2C14E; --gold-soft:#4B3A17;
    --good:#7CD3A0; --good-soft:#1E3A2C; --warn:#F0C25C; --warn-soft:#44341A; --bad:#F2897E; --bad-soft:#4A2420;
    --shadow:3px 3px 0 #0E0B1D; --shadow-a:2px 2px 0 rgba(0,0,0,.6); --dots:rgba(169,155,255,.10); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16122A; --panel:#211A3A; --ink:#F2EEFF; --muted:#B6AED6; --line:#352C5C; --soft:#2A2247; --edge:#4A3F7A;
  --accent-ink:#1B1230; --gold:#F2C14E; --gold-soft:#4B3A17;
  --good:#7CD3A0; --good-soft:#1E3A2C; --warn:#F0C25C; --warn-soft:#44341A; --bad:#F2897E; --bad-soft:#4A2420;
  --shadow:3px 3px 0 #0E0B1D; --shadow-a:2px 2px 0 rgba(0,0,0,.6); --dots:rgba(169,155,255,.10); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background-color:var(--bg);background-image:radial-gradient(var(--dots) 1px,transparent 1.3px);background-size:20px 20px;color:var(--ink);font-family:var(--ui);font-size:14px;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1500px;margin:0 auto;padding:14px}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance;font-family:var(--display);font-variation-settings:"SOFT" 100,"WONK" 1}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted);font-size:12.5px}
.card,.top,.bar,.where,.stage{border:1.5px solid var(--edge)}
.card{background:var(--panel);border-radius:20px;box-shadow:var(--shadow)}

/* dashboard */
.top{background:var(--panel);border-radius:22px;box-shadow:var(--shadow);padding:22px 18px 14px;display:grid;gap:12px;position:relative;overflow:hidden}
.top::before{content:"";position:absolute;left:0;right:0;top:0;height:8px;background:linear-gradient(90deg,#8E1B3A 0 20%,#F2603F 20% 40%,#F2B134 40% 60%,#0F9D94 60% 80%,#6A4FD6 80%)}
.top-head{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}
.top-head h1{font-size:23px;font-weight:650;color:var(--accent);letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1.5px solid var(--edge);background:var(--panel);border-radius:999px;padding:7px 15px;font-weight:500}
.btn:hover{background:var(--accent-soft)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600;box-shadow:var(--shadow-a)}
.btn.primary:hover{transform:translate(1px,1px);box-shadow:1px 1px 0 rgba(36,27,59,.85)}
.btn.sm{padding:4px 11px;font-size:12px}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.save{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.save i{width:8px;height:8px;border-radius:50%;background:var(--gold);display:inline-block}
.save.acc i{background:var(--good)}
.stats{display:flex;flex-wrap:wrap;gap:14px 0;align-items:center}
.stat{display:grid;gap:0;padding:0 22px;border-left:2px dotted var(--edge);min-width:0}
.stat:first-child{padding-left:0;border-left:0}
.stat b{font-family:var(--display);font-variation-settings:"SOFT" 100,"WONK" 1;font-size:26px;font-weight:650;line-height:1.1}
.stat small{color:var(--muted);font-size:12px}
.ringstat{display:flex;gap:12px;align-items:center}
.ringstat>div{display:grid}
.ring{width:58px;height:58px;flex:none}
.ring circle{fill:none;stroke-width:9}
.ring .bg{stroke:var(--line)} .ring .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .4s}
.ring text{font:650 17px var(--display);fill:var(--ink)}
.bars7{display:flex;gap:3px;align-items:flex-end;height:18px;margin-top:3px}
.bars7 span{flex:1;background:var(--gold);border-radius:3px;min-height:2px}
.bars7 span.z{background:var(--line)}
.strip{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px}
.phs{grid-template-columns:repeat(6,minmax(0,1fr))}
.chip{border:1.5px solid var(--c,var(--edge));background:var(--panel);border-radius:999px;padding:6px 14px;text-align:left;display:grid;gap:4px}
.chip:hover{background:color-mix(in srgb,var(--c,var(--accent)) 14%,var(--panel))}
.chip.on{background:var(--c,var(--accent));color:var(--ci,var(--accent-ink));box-shadow:var(--shadow-a)}
.chip .t{display:flex;justify-content:space-between;font-size:12px;font-weight:600}
.chip .t span:last-child{opacity:.75;font-weight:500}
.chip .meter{background:color-mix(in srgb,var(--c,var(--accent)) 22%,transparent)}
.chip .meter i{background:var(--c,var(--accent))}
.chip.on .meter{background:color-mix(in srgb,var(--ci,#fff) 30%,transparent)}
.chip.on .meter i{background:var(--ci,var(--accent-ink))}
.meter{height:6px;border-radius:999px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .3s}
.meter.amber i{background:var(--gold)}
.how{font-size:13px;color:var(--muted);margin-top:8px;padding-top:8px;border-top:2px dotted var(--edge)}
.how summary{cursor:pointer;color:var(--ink);font-weight:500}
.how p{margin:6px 0 0;max-width:90ch}

/* stacked layout */
.cols{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;margin-top:16px}
.rail{padding:12px 14px;display:grid;gap:8px}
.ctitle{display:flex;justify-content:space-between;align-items:center}
.chrow{display:flex;gap:6px;flex-wrap:wrap}
.cchip{border:1.5px solid var(--edge);background:var(--panel);border-radius:999px;padding:5px 12px;min-width:84px;display:grid;gap:3px;text-align:left}
.cchip:hover{background:var(--accent-soft);border-color:var(--accent)}
.cchip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow-a)}
.cchip .t{display:flex;justify-content:space-between;gap:10px;font-size:12px;font-weight:600}
.cchip .t span:last-child{opacity:.75;font-weight:500}
.cchip .meter{height:4px;background:color-mix(in srgb,var(--accent) 20%,transparent)}
.cchip.on .meter{background:color-mix(in srgb,var(--accent-ink) 30%,transparent)}
.cchip.on .meter i{background:var(--accent-ink)}
.chinfo{display:flex;flex-wrap:wrap;gap:2px 14px;align-items:baseline}
.chinfo b{font-family:var(--display);font-variation-settings:"SOFT" 100,"WONK" 1;font-weight:600;font-size:15px}
.secrow{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:thin}
.spill{flex:none;display:inline-flex;gap:7px;align-items:center;border:1.5px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 11px;font-size:12.5px;white-space:nowrap}
.spill:hover{border-color:var(--accent);background:var(--accent-soft)}
.spill.here{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.spill .pg{font-family:var(--mono);font-size:11px;color:var(--muted)}
.dot{width:11px;height:11px;border-radius:50%;border:2px solid var(--edge);flex:none}
.dot.part{border-color:var(--accent);background:linear-gradient(90deg,var(--accent) 50%,transparent 50%)}
.dot.done{border-color:var(--accent);background:var(--accent)}

/* reader */
.reader{min-width:0}
.focus .top,.focus .rail{display:none}.focus .cols{margin-top:0}.focus .wrap{padding-top:8px}
.bar{position:sticky;top:0;z-index:5;background:var(--panel);border-radius:20px 20px 0 0;padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.seg{display:inline-flex;border:1.5px solid var(--edge);border-radius:999px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:6px 13px;font-weight:500}
.seg button+button{border-left:1.5px solid var(--edge)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.pager{display:inline-flex;align-items:center;gap:6px}
.pager input{width:58px;text-align:center;border:1.5px solid var(--edge);border-radius:999px;padding:5px;background:var(--bg);color:var(--ink);font:500 13px var(--mono)}
.sp{flex:1}
.where{padding:8px 14px;border-top:0;background:var(--panel);display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.where b{font-weight:600}
.pill{font-size:12px;padding:2px 9px;border-radius:999px;background:var(--soft);border:1px solid var(--line);color:var(--ink)}
.pill.read{background:var(--good-soft);color:var(--good);font-weight:600;border-color:transparent}
.pill.mute{color:var(--muted)}
.tools{display:inline-flex;gap:2px;align-items:center;flex-wrap:wrap;margin-left:auto}
.tools .btn{border-color:transparent;background:transparent;padding:4px 10px;color:var(--muted)}
.tools .btn:hover{background:var(--accent-soft);color:var(--ink)}
.tools .btn[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid var(--edge);background:var(--hcol);padding:0;margin:0 1px}
.sw.on{outline:2px solid var(--ink);outline-offset:1px}
.stage{border-top:0;border-radius:0 0 20px 20px;background:var(--panel);padding:14px}
.stage.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
.pagebox{overflow:auto;text-align:center;background:var(--soft);border-radius:16px;padding:12px}
.pimg{position:relative;margin:0 auto}
.pimg img{display:block;width:100%;height:auto;border-radius:6px;box-shadow:3px 3px 0 var(--edge),0 6px 18px rgba(36,27,59,.14);background:#fff}
.pagebox.night img{filter:invert(.9) hue-rotate(180deg)}
.hlayer{position:absolute;inset:0;pointer-events:none}
.hm .hlayer{pointer-events:auto;cursor:crosshair;touch-action:none}
.hr{position:absolute;background:var(--hcol);opacity:.55;mix-blend-mode:multiply;border-radius:3px;pointer-events:none}
.hm .hr{pointer-events:auto;cursor:pointer}
.hc0{--hcol:#FFE066}.hc1{--hcol:#6FE0AC}.hc2{--hcol:#FF9EC3}.hc3{--hcol:#8AD0FF}
.hlt{background:color-mix(in srgb,var(--hcol) 70%,transparent);border-radius:3px;cursor:pointer;color:inherit}
.dotc{width:12px;height:12px;border-radius:50%;background:var(--hcol);display:inline-block}
.hlpop{position:fixed;z-index:60;background:var(--panel);border:1.5px solid var(--edge);border-radius:999px;padding:6px 10px;display:flex;gap:6px;align-items:center;box-shadow:var(--shadow-a)}
.hlpop[hidden]{display:none}
.hlpop .sw{width:26px;height:26px}
.textbox{font-family:var(--serif);font-size:16.5px;line-height:1.6;max-width:72ch;margin:0 auto;white-space:pre-line;overflow-wrap:anywhere}
.textbox .h{font-family:var(--ui);font-weight:600;font-size:15px;display:inline-block;margin-top:4px}
.textbox mark,.item mark{background:var(--gold-soft);color:var(--ink);box-shadow:0 0 0 2px var(--gold-soft);border-radius:2px}
.warnnote{font-size:12.5px;color:var(--warn);background:var(--warn-soft);border-radius:12px;padding:6px 10px;margin:0 0 12px}
.stage.two .textbox{font-size:15px;max-height:80vh;overflow:auto;padding-right:6px}
.foot{display:flex;justify-content:space-between;gap:8px;margin-top:12px;flex-wrap:wrap}

/* study tools (below the reader) */
.side{padding:0;max-width:1000px;width:100%;margin:0 auto}
.tabs{display:flex;border-bottom:2px dotted var(--edge);padding:0 8px;align-items:center}
.tabs button[role="tab"]{flex:1;background:none;border:0;padding:11px 6px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.upbtn{flex:none;border:1.5px solid var(--edge)!important;border-radius:999px;padding:4px 12px!important;font-size:12px;background:var(--panel)!important;color:var(--ink)!important;margin-left:8px}
.pane{padding:14px;display:grid;gap:12px}
textarea{width:100%;min-height:150px;resize:vertical;border:1.5px solid var(--edge);border-radius:14px;padding:10px;background:var(--bg);color:var(--ink);font:15px/1.5 var(--serif)}
input[type="search"]{width:100%;border:1.5px solid var(--edge);border-radius:14px;padding:9px 12px;background:var(--bg);color:var(--ink);font:inherit}
select{border-radius:999px!important;border:1.5px solid var(--edge)!important;background:var(--bg)!important}
.list{display:grid;gap:6px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.item{width:100%;text-align:left;border:1.5px solid var(--line);background:var(--panel);border-radius:14px;padding:8px 12px;display:grid;gap:3px;align-content:start}
.item:hover{border-color:var(--accent);background:var(--accent-soft)}
.item .m{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);align-items:center}
.item .m b{font-family:var(--mono);color:var(--ink)}
.item p{margin:0;font-size:13px;overflow-wrap:anywhere}
.qcard{border:1.5px solid var(--edge);border-radius:18px;padding:14px;display:grid;gap:10px;background:var(--panel);box-shadow:var(--shadow)}
.qcard .q{font-family:var(--serif);font-size:17px;line-height:1.5;overflow-wrap:anywhere}
.qcard .a{font-family:var(--serif);font-size:15.5px;line-height:1.55;background:var(--soft);border-radius:14px;border-left:4px solid var(--gold);padding:10px 12px;overflow-wrap:anywhere}
.lv{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 9px;border-radius:999px;background:var(--gold-soft);color:var(--ink)}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.rate button{border:1.5px solid var(--edge);background:var(--panel);border-radius:999px;padding:8px 4px;font-weight:600}
.rate .r0:hover{background:var(--bad-soft)} .rate .r1:hover{background:var(--warn-soft)} .rate .r2:hover{background:var(--good-soft)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.qd{width:32px;height:26px;border-radius:999px;border:1.5px solid var(--edge);background:var(--panel);font:600 11px var(--mono)}
.qd.m0{background:var(--bad-soft);border-color:var(--bad)} .qd.m1{background:var(--warn-soft);border-color:var(--warn)} .qd.m2{background:var(--good-soft);border-color:var(--good)}
.qd.cur{outline:2px solid var(--accent);outline-offset:1px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);padding:8px 14px;border-radius:999px;font-size:13px;box-shadow:var(--shadow-a);opacity:0;pointer-events:none;transition:opacity .2s;z-index:70}
.toast.on{opacity:1}
@media (max-width:860px){
  .strip{grid-template-columns:repeat(4,minmax(0,1fr))}.phs{grid-template-columns:repeat(3,minmax(0,1fr))}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:12px 0}.ringstat{grid-column:1/-1}.stat,.stat:nth-child(odd){padding:0 0 0 14px;border-left:2px dotted var(--edge)}.stat:first-child{padding-left:0;border-left:0}
  .stage.two{grid-template-columns:minmax(0,1fr)}
  .bar{position:static}
}
@media (max-width:480px){.wrap{padding:10px}.phs{grid-template-columns:repeat(2,minmax(0,1fr))}.seg button{padding:6px 9px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <section class="top" id="top" aria-label="Reading progress"></section>
  <div class="cols">
    <aside class="card rail" id="rail" aria-label="Contents"></aside>
    <main class="reader" id="reader"></main>
    <aside class="card side" id="side" aria-label="Study tools"></aside>
  </div>
</div>
<div class="hlpop" id="hlpop" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="data/manifest.js"></script>
<script>
(function(){
"use strict";
var M=window.MANIFEST, PH=M.phases, CHALL=M.chapters;
var PAGES=[],CH=[],CARDS=[],FIRST=1,LAST=1,CUR=1,BYP={},CHBY={};
CHALL.forEach(function(c){CHBY[c.n]=c;});
var KEY="book-reading-v1", OLDKEY="phase4-reading-v1";
function phaseOf(p){for(var i=0;i<PH.length;i++){if(p>=PH[i].start&&p<=PH[i].end)return PH[i].n;}return 1;}
var loadedPh={};
function ensurePhase(n,cb){
  if(window.PHASE_DATA&&window.PHASE_DATA[n]){cb();return;}
  if(loadedPh[n]){loadedPh[n].push(cb);return;}
  loadedPh[n]=[cb];
  var sc=document.createElement("script");sc.src="data/phase"+n+".js";
  sc.onload=function(){var q=loadedPh[n];loadedPh[n]=null;q.forEach(function(f){f();});};
  sc.onerror=function(){loadedPh[n]=null;toast("Could not load Phase "+n+". Check your connection and try again.");};
  document.head.appendChild(sc);
}
function applyPhase(n){
  var ph=PH[n-1],D=window.PHASE_DATA[n];CUR=n;PAGES=D.pages;CARDS=D.cards;
  CH=CHALL.filter(function(c){return c.phase===n;});FIRST=ph.start;LAST=ph.end;
  BYP={};PAGES.forEach(function(p){BYP[p.printed]=p;});applyAccent();
}
var PALL=[["#8E1B3A","#FFFFFF"],["#E8502F","#FFFFFF"],["#F2B134","#241B3B"],["#0B8F87","#FFFFFF"],["#6A4FD6","#FFFFFF"],["#CC2E85","#FFFFFF"]];
var PALD=[["#E8708B","#1B1230"],["#FF8A65","#1B1230"],["#F2C14E","#1B1230"],["#4FD1C5","#1B1230"],["#A99BFF","#1B1230"],["#F472B6","#1B1230"]];
function isDark(){var t=document.documentElement.getAttribute("data-theme");return t?t==="dark":window.matchMedia("(prefers-color-scheme:dark)").matches;}
function pal(n){return (isDark()?PALD:PALL)[(n-1)%6];}
function applyAccent(){var c=pal(CUR),r=document.documentElement.style;r.setProperty("--accent",c[0]);r.setProperty("--accent-ink",c[1]);}
function phasePct(n){var ph=PH[n-1],r=0,t=ph.end-ph.start+1;for(var p=ph.start;p<=ph.end;p++){if(S.read[p])r++;}return t?r/t:0;}
function resumeOf(n){var ph=PH[n-1];for(var p=ph.start;p<=ph.end;p++){if(!S.read[p])return p;}return ph.start;}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function $(id){return document.getElementById(id);}
function today(){return new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);}

/* ---------- state ---------- */
var S={v:1,read:{},notes:{},marks:{},hl:{},bm:[],mins:{},last:1,set:{auto:true,view:"page",zoom:1,night:false,hc:0,compact:null,focus:false}};
var U={sw:false,tab:"notes",q:"",qi:0,qf:"all",reveal:false,open:{},qmode:"quiz"};
var ref=null, saveT=null, status="local";
function normalize(d){

function localLoad(){try{var t=localStorage.getItem(KEY)||localStorage.getItem(OLDKEY);return t?JSON.parse(t):null;}catch(e){return null;}}
function localSave(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function merge(a,b){ /* a = local, b = cloud: keep newest per item */
  var o=normalize(a);
  Object.keys(b.read||{}).forEach(function(k){o.read[k]=Math.max(o.read[k]||0,b.read[k]);});
  Object.keys(b.notes||{}).forEach(function(k){var x=o.notes[k],y=b.notes[k]; if(!x||(y&&y.ts>x.ts))o.notes[k]=y;});
  Object.keys(b.marks||{}).forEach(function(k){var x=o.marks[k],y=b.marks[k]; if(!x||(y&&y.ts>x.ts))o.marks[k]=y;});
  Object.keys(b.hl||{}).forEach(function(k){var arr=o.hl[k]=o.hl[k]||[];b.hl[k].forEach(function(y){var x=null;for(var i=0;i<arr.length;i++){if(arr[i].id===y.id)x=arr[i];}if(!x)arr.push(y);else if(y.ts>x.ts){arr[arr.indexOf(x)]=y;}});});
  (b.bm||[]).forEach(function(p){if(o.bm.indexOf(p)<0)o.bm.push(p);});
  Object.keys(b.mins||{}).forEach(function(k){o.mins[k]=Math.max(o.mins[k]||0,b.mins[k]);});
  if(!Object.keys(a.read||{}).length&&b.last)o.last=b.last;
  return o;
}
function setStatus(s){status=s;var e=$("savetxt");if(e){e.textContent=s==="account"?"Saved to your account":s==="saving"?"Saving…":"Saved in this browser";e.parentNode.className="save "+(s==="account"?"acc":"");}}
function save(){localSave(); if(saveT)clearTimeout(saveT); saveT=setTimeout(function(){
  if(!ref)return; setStatus("saving");
  Promise.resolve().then(function(){return ref.set(JSON.parse(JSON.stringify(S)));}).then(function(){setStatus("account");}).catch(function(){setStatus("local");});
},1500);}
function unwrap(snap){ if(!snap)return null; try{ if(typeof snap.exists==="function"&&!snap.exists())return null; if(snap.exists===false)return null; if(typeof snap.data==="function")return snap.data(); if(snap.data!==undefined)return snap.data; }catch(e){} return snap; }
function initCloud(){
  if(!window.claude||!window.claude.use)return;
  Promise.all([window.claude.use("user"),window.claude.use("db")]).then(function(r){
    var user=r[0],db=r[1]; if(!user||!db||!user.id)return;
    return Promise.resolve(user.id()).then(function(id){
      if(!id)return; var rr=db.collection("data/users/"+id).doc("book-reading"),lg=db.collection("data/users/"+id).doc("phase4-reading");
      var t=new Promise(function(_,rej){setTimeout(function(){rej(new Error("timeout"));},10000);});
      return Promise.race([Promise.all([rr.get(),lg.get().catch(function(){return null;})]),t]).then(function(sn){
        var d=unwrap(sn[0]),d0=unwrap(sn[1]); if(d0&&d0.v===1){S=merge(S,d0);} if(d&&d.v===1){S=merge(S,d);} ref=rr; localSave(); setStatus("account"); renderAll(); save();
      });
    });
  }).catch(function(){ref=null;setStatus("local");});
}

/* ---------- derived numbers ---------- */
function isRead(p){return !!S.read[p];}
function chRead(c){var ch=CHBY[c],n=0;for(var p=ch.start;p<=ch.end;p++){if(isRead(p))n++;}return n;}
function chOf(printed){for(var i=0;i<CHALL.length;i++){if(printed>=CHALL[i].start&&printed<=CHALL[i].end)return CHALL[i].n;}return 0;}
function secSpan(c,i){var ch=CHBY[c],s=ch.sections,a=s[i].page,b=(i+1<s.length)?s[i+1].page:ch.end+1; if(b<=a)b=a+1; return [a,Math.min(b-1,ch.end)];}
function secPct(c,i){var sp=secSpan(c,i),n=0,r=0;for(var p=sp[0];p<=sp[1];p++){n++;if(isRead(p))r++;}return n?r/n:0;}
function totalRead(){return PAGES.filter(function(p){return isRead(p.printed);}).length;}
function hoursLeft(){var h=0;PAGES.forEach(function(p){if(!isRead(p.printed)&&p.ch){var c=CHBY[p.ch];h+=c.hours/(c.end-c.start+1);}});return h;}
function hoursTotal(){return CH.reduce(function(a,c){return a+c.hours;},0);}
function cardsOf(c){return CARDS.filter(function(x){return x.ch===c;});}
function mval(id){var m=S.marks[id];return m?m.v:-1;}
function mastery(list){if(!list.length)return 0;var t=0;list.forEach(function(x){var v=mval(x.id);if(v===2)t+=1;else if(v===1)t+=.5;});return t/list.length;}
function rated(list){return list.filter(function(x){return mval(x.id)>=0;}).length;}
function fmtH(h){return h<1?Math.round(h*60)+" min":h.toFixed(1)+" h";}
function lastDays(n){var o=[];for(var i=n-1;i>=0;i--){var d=new Date(Date.now()-new Date().getTimezoneOffset()*60000-i*864e5).toISOString().slice(0,10);o.push([d,S.mins[d]||0]);}return o;}

  if(n!==CUR)ensurePhase(n,fin);else fin();}

function sectionsOn(printed){
  var ch=CHBY[chOf(printed)]; if(!ch)return {carry:null,start:[]};
  var carry=null,start=[]; ch.sections.forEach(function(s){ if(s.page<printed)carry=s; else if(s.page===printed)start.push(s);});
  return {carry:carry,start:start};
}
function hl(text,q){
  var t=esc(text); if(!q)return t;
  q.split(/\s+/).filter(function(w){return w.length>1;}).forEach(function(w){var re=new RegExp("("+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi");t=t.replace(re,"<mark>$1</mark>");});
  return t;
}
function textHtml(pg){
  var T=pg.text, hs=(S.hl[pg.printed]||[]).filter(function(h){return h.k==="t"&&!h.del;}), out=[], off=0;
  T.split("\n").forEach(function(l){
    var end=off+l.length, cuts=[off,end];
    hs.forEach(function(h){if(h.a>off&&h.a<end)cuts.push(h.a);if(h.b>off&&h.b<end)cuts.push(h.b);});
    cuts.sort(function(x,y){return x-y;});
    var segs="";
    for(var i=0;i<cuts.length-1;i++){var a=cuts[i],b=cuts[i+1];if(b<=a)continue;var html=hl(T.slice(a,b),U.q),hh=null;
      hs.forEach(function(h){if(h.a<=a&&h.b>=b)hh=h;});
      segs+=hh?'<span class="hlt hc'+hh.c+'" data-hid="'+hh.id+'">'+html+'</span>':html;}
    var m=/^(\d+\.\d+\s+)(.*)$/.exec(l);
    out.push(m&&/^[A-Z]/.test(m[2])&&l.length<90?'<span class="h">'+segs+'</span>':segs);
    off=end+1;
  });
  return out.join("\n");
}

  if(t==="notes"){
    var p=S.last,n=S.notes[p];
    h+='<div><div class="eyebrow">Note for page '+p+'</div></div><textarea id="note" placeholder="Key ideas, formulas to remember, questions for your supervisor" aria-label="Note for this page">'+esc(n?n.t:"")+'</textarea><div class="muted">Saved as you type.</div>';
    var ks=Object.keys(S.notes).filter(function(k){return S.notes[k].t;}).map(Number).sort(function(a,b){return a-b;});
    h+='<div id="notelist"><div class="eyebrow">All notes ('+ks.length+')</div><div class="list">'+(ks.length?ks.map(function(k){return '<button class="item" data-go="'+k+'"><span class="m"><b>p. '+k+'</b><span>Ch. '+chOf(k)+'</span></span><p>'+esc(S.notes[k].t.slice(0,140))+'</p></button>';}).join(""):'<p class="muted">No notes yet. Notes you write on a page show up here.</p>')+'</div></div>';
  } else if(t==="check"){
    h+=renderCheck();
  } else if(t==="find"){
    h+='<label class="muted" style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="sw" '+(U.sw?'checked':'')+'> Search the whole book</label><input type="search" id="q" placeholder="Search '+(U.sw?'the whole book':'Phase '+CUR)+'" value="'+esc(U.q)+'" aria-label="Search the text">';
    if(U.q.trim().length>1){
      var terms=U.q.toLowerCase().split(/\s+/).filter(Boolean),res=[];
      var pool=U.sw?allPages():PAGES;
      pool.forEach(function(pg){var low=pg.text.toLowerCase();if(terms.every(function(w){return low.indexOf(w)>=0;})){var i=low.indexOf(terms[0]);var a=Math.max(0,i-50),b=Math.min(pg.text.length,i+90);res.push({p:pg.printed,s:(a>0?"…":"")+pg.text.slice(a,b).replace(/\s+/g," ")+(b<pg.text.length?"…":"")});}});
      h+='<div class="muted">'+res.length+' page'+(res.length===1?'':'s')+' match. Equations are not searchable because their text is garbled.</div><div class="list">'+res.slice(0,40).map(function(r){return '<button class="item" data-go="'+r.p+'" data-text="1"><span class="m"><b>p. '+r.p+'</b><span>Ch. '+chOf(r.p)+'</span></span><p>'+hl(r.s,U.q)+'</p></button>';}).join("")+'</div>';
    } else h+='<p class="muted">Type two or more letters. Results open that page and highlight the words in Text view.</p>';
  } else {
    var bms=S.bm.slice().sort(function(a,b){return a-b;});
    h+='<div class="eyebrow">Bookmarks ('+bms.length+')</div><div class="list">'+(bms.length?bms.map(function(k){var s=sectionsOn(k),lab=s.start[0]||s.carry;return '<button class="item" data-go="'+k+'"><span class="m"><b>p. '+k+'</b><span>Ch. '+chOf(k)+'</span></span><p>'+esc(lab?(lab.num?lab.num+' ':'')+lab.title:'Phase '+CUR+' opener')+'</p></button>';}).join(""):'<p class="muted">Use \u2606 Bookmark in the page toolbar to save a place.</p>')+'</div>';
    var hls=[];Object.keys(S.hl).forEach(function(k){S.hl[k].forEach(function(x){if(!x.del)hls.push({p:+k,h:x});});});hls.sort(function(a,b){return a.p-b.p||a.h.ts-b.h.ts;});
    h+='<div class="eyebrow">Highlights ('+hls.length+')</div><div class="list">'+(hls.length?hls.slice(0,120).map(function(x){return '<button class="item" data-go="'+x.p+'" '+(x.h.k==="t"?'data-text="1"':'data-page="1"')+'><span class="m"><b>p. '+x.p+'</b><span class="dotc hc'+x.h.c+'"></span></span><p>'+esc(x.h.k==="t"?x.h.q:"Marked area on the page")+'</p></button>';}).join(""):'<p class="muted">Press \u270E Highlight and drag across the page, or select text in Text view.</p>')+'</div>';
    var rs=Object.keys(S.read).map(Number).sort(function(a,b){return S.read[b]-S.read[a];}).slice(0,8);
    h+='<div class="eyebrow">Recently read</div><div class="list">'+(rs.length?rs.map(function(k){return '<button class="item" data-go="'+k+'"><span class="m"><b>p. '+k+'</b><span>'+new Date(S.read[k]).toLocaleDateString(undefined,{day:"numeric",month:"short"})+'</span></span></button>';}).join(""):'<p class="muted">Pages you mark as read appear here.</p>')+'</div>';
    h+='<details class="how"><summary>How progress is tracked</summary><p>Pressing Next (or \u2192) marks the page you leave as read. You can also toggle Read on any page. Chapter and section bars come from those pages. Time counts only while this tab is open and you are active. Self-check ratings feed the Self-check score. Highlights, notes and progress are saved to your account when you are signed in, and always in this browser.</p></details>'+(window.claude&&window.claude.use?'':'<div class="eyebrow">Backup</div><div class="row"><button class="btn sm" id="exp">Export progress</button><button class="btn sm" id="imp">Import progress</button><input type="file" id="impf" accept=".json" style="display:none"></div><p class="muted">Progress, notes and highlights live in this browser. Export a file to back them up or move to another device.</p>');
  }
  $("side").innerHTML=h+'</div>';
}
function allPages(){var a=[];for(var n=1;n<=PH.length;n++){if(window.PHASE_DATA&&window.PHASE_DATA[n])a=a.concat(window.PHASE_DATA[n].pages);}return a;}
function notesListHtml(){var ks=Object.keys(S.notes).filter(function(k){return S.notes[k].t;}).map(Number).sort(function(a,b){return a-b;});return '<div><div class="eyebrow">All notes ('+ks.length+')</div><div class="list">'+(ks.length?ks.map(function(k){return '<button class="item" data-go="'+k+'"><span class="m"><b>p. '+k+'</b><span>Ch. '+chOf(k)+'</span></span><p>'+esc(S.notes[k].t.slice(0,140))+'</p></button>';}).join(""):'<p class="muted">No notes yet. Notes you write on a page show up here.</p>')+'</div></div>';}
function curChap(){var c=chOf(S.last);return c||CH[0].n;}
function deck(){var c=curChap(),l=cardsOf(c);if(U.qf==="todo")l=l.filter(function(x){return mval(x.id)!==2;});else if(U.qf!=="all")l=l.filter(function(x){return x.lv===U.qf;});return l;}
function renderCheck(){
  var c=curChap(),all=cardsOf(c),d=deck(),h='';
  var lvls=[]; all.forEach(function(x){if(lvls.indexOf(x.lv)<0)lvls.push(x.lv);});
  h+='<div class="row" style="justify-content:space-between"><div><div class="eyebrow">Chapter '+c+' self-check</div><div class="muted num">'+rated(all)+' of '+all.length+' rated · '+Math.round(mastery(all)*100)+'% mastery</div></div><button class="btn sm" data-go="'+(CHBY[c].chk||CHBY[c].start)+'" data-page="1">See the printed page</button></div>';
  h+='<div class="meter amber"><i style="width:'+(mastery(all)*100)+'%"></i></div>';
  h+='<div class="row"><label class="muted" for="qf">Show</label><select id="qf" style="border:1px solid var(--line);border-radius:6px;padding:5px;background:var(--panel);color:var(--ink)"><option value="all"'+(U.qf==="all"?' selected':'')+'>All questions</option><option value="todo"'+(U.qf==="todo"?' selected':'')+'>Not yet "Got it"</option>'+lvls.map(function(l){return '<option value="'+esc(l)+'"'+(U.qf===l?' selected':'')+'>'+esc(l)+'</option>';}).join("")+'</select></div>';
  if(!d.length){return h+'<p class="muted">Nothing here. Every question in this filter is rated Got it.</p>';}
  if(U.qi>=d.length)U.qi=0; var q=d[U.qi], mv=mval(q.id);
  h+='<div class="qcard"><div class="row" style="justify-content:space-between"><span class="lv">'+esc(q.lv)+'</span><span class="muted num">Q'+esc(q.id)+' · '+(U.qi+1)+' of '+d.length+'</span></div><div class="q">'+esc(q.q)+'</div>';
  if(U.reveal){h+='<div class="a">'+esc(q.a||"No answer sketch found. Open the printed page.")+'</div><div class="muted">If the maths looks garbled, open the printed page to read the original.</div><div class="rate"><button class="r0" data-rate="0">1 · Missed</button><button class="r1" data-rate="1">2 · Shaky</button><button class="r2" data-rate="2">3 · Got it</button></div>';}
  else h+='<button class="btn primary" id="rev">Show answer (Space)</button>';
  h+='<div class="row" style="justify-content:space-between"><button class="btn sm" id="qp">\u2190 Previous</button><span class="muted">'+(mv>=0?['Last: missed','Last: shaky','Last: got it'][mv]:'Not rated yet')+'</span><button class="btn sm" id="qn">Next \u2192</button></div></div>';
  h+='<div class="chips" aria-label="All questions in this chapter">'+all.map(function(x){var i=d.indexOf(x);var m=mval(x.id);return '<button class="qd '+(m>=0?'m'+m:'')+(i===U.qi?' cur':'')+'" data-qid="'+esc(x.id)+'" title="'+esc(x.lv)+'">'+esc(x.id.split(".")[1])+'</button>';}).join("")+'</div>';
  return h;
}

/* ---------- wiring ---------- */
function renderAll(){renderTop();renderRail();renderReader();renderSide();}
function applyTheme(){var t=window.__theme;if(t)document.documentElement.setAttribute("data-theme",t);}
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-go],[data-phase],[data-tog],[data-view],[data-tab],[data-rate],[data-qid],button,#theme");if(!t)return;
  if(t.hasAttribute("data-hlc")){if(U.sel){var pgx=BYP[S.last];addHl(S.last,{k:"t",a:U.sel.a,b:U.sel.b,c:+t.getAttribute("data-hlc"),q:pgx.text.slice(U.sel.a,U.sel.b).replace(/\s+/g," ").trim().slice(0,220)});U.sel=null;}var sl=window.getSelection();if(sl)sl.removeAllRanges();hidePop();renderReader();renderSide();return;}
  if(t.hasAttribute("data-hlrm")){delHl(S.last,t.getAttribute("data-hlrm"));hidePop();renderReader();renderSide();return;}
  if(t.hasAttribute("data-hcset")){S.set.hc=+t.getAttribute("data-hcset");save();renderReader();return;}
  if(t.hasAttribute("data-go")){var p=+t.getAttribute("data-go");if(t.hasAttribute("data-text"))S.set.view=S.set.view==="page"?"text":S.set.view;if(t.hasAttribute("data-page"))S.set.view="page";go(p);return;}
  if(t.hasAttribute("data-phase")){go(resumeOf(+t.getAttribute("data-phase")));return;}
  if(t.hasAttribute("data-tog")){var c=+t.getAttribute("data-tog");var cur=U.open[c]===undefined?(chOf(S.last)===c):U.open[c];U.open[c]=!cur;renderRail();return;}
  if(t.hasAttribute("data-view")){S.set.view=t.getAttribute("data-view");save();renderReader();return;}
  if(t.hasAttribute("data-tab")){U.tab=t.getAttribute("data-tab");renderSide();return;}
  if(t.hasAttribute("data-rate")){var q=deck()[U.qi];if(q){S.marks[q.id]={v:+t.getAttribute("data-rate"),ts:Date.now()};save();U.reveal=false;var d=deck();U.qi=Math.min(U.qi+1,Math.max(0,d.length-1));renderTop();renderRail();renderSide();}return;}
  if(t.hasAttribute("data-qid")){var d2=deck(),i=d2.map(function(x){return x.id;}).indexOf(t.getAttribute("data-qid"));if(i<0){U.qf="all";d2=deck();i=d2.map(function(x){return x.id;}).indexOf(t.getAttribute("data-qid"));}U.qi=Math.max(0,i);U.reveal=false;renderSide();return;}
  var id=t.id;
  if(id==="exp"){var b=new Blob([JSON.stringify(S,null,1)],{type:"application/json"});var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="phase4-progress-"+new Date().toISOString().slice(0,10)+".json";a.click();return;}
  if(id==="imp"){$("impf").click();return;}
  if(id==="cmp"){S.set.compact=!cmpState();save();renderTop();return;}
  if(id==="hm"){U.hm=!U.hm;if(U.hm){S.set.view=S.set.view==="text"?"page":S.set.view;toast("Highlighter on: drag across the page. Click a highlight to remove it.");}renderReader();return;}
  if(id==="fx"){S.set.focus=!S.set.focus;save();renderReader();window.scrollTo({top:0});return;}
  if(id==="jt"){$("side").scrollIntoView({behavior:"smooth",block:"start"});return;}
  if(id==="up"){$("reader").scrollIntoView({behavior:"smooth",block:"start"});return;}
  if(id==="theme"){var cur2=document.documentElement.getAttribute("data-theme");var dark=cur2?cur2==="dark":window.matchMedia("(prefers-color-scheme:dark)").matches;document.documentElement.setAttribute("data-theme",dark?"light":"dark");applyAccent();renderTop();return;}
  if(id==="nx"||id==="nx2")return next();
  if(id==="pv"||id==="pv2")return prev();
  if(id==="zi"){S.set.zoom=Math.min(2,Math.round((S.set.zoom+.25)*100)/100);save();renderReader();return;}
  if(id==="zo"){S.set.zoom=Math.max(.5,Math.round((S.set.zoom-.25)*100)/100);save();renderReader();return;}
  if(id==="night"){S.set.night=!S.set.night;save();renderReader();return;}
  if(id==="bm"){var i2=S.bm.indexOf(S.last);if(i2>=0)S.bm.splice(i2,1);else S.bm.push(S.last);save();renderReader();renderSide();return;}
  if(id==="rd"){mark(S.last,!isRead(S.last));renderTop();renderRail();renderReader();return;}
  if(id==="rev"){U.reveal=true;renderSide();return;}
  if(id==="qn"||id==="qp"){var n=deck().length;U.qi=(U.qi+(id==="qn"?1:-1)+n)%n;U.reveal=false;renderSide();return;}
});
document.addEventListener("change",function(e){
  var t=e.target;
  if(t.id==="sw"){U.sw=t.checked;if(U.sw){var miss=[];for(var n=1;n<=PH.length;n++){if(!(window.PHASE_DATA&&window.PHASE_DATA[n]))miss.push(n);}var left=miss.length;if(!left){renderSide();}else{toast("Loading all phases for search…");miss.forEach(function(n){ensurePhase(n,function(){if(--left===0)renderSide();});});}}else renderSide();}
  else if(t.id==="auto"){S.set.auto=t.checked;save();renderReader();}
  else if(t.id==="pj"){var v=parseInt(t.value,10);if(isFinite(v))go(v,{noScroll:true});else t.value=S.last;}
  else if(t.id==="qf"){U.qf=t.value;U.qi=0;U.reveal=false;renderSide();}
});
var noteT=null;
document.addEventListener("input",function(e){
  var t=e.target;
  if(t.id==="note"){var p=S.last,v=t.value;if(v.trim())S.notes[p]={t:v,ts:Date.now()};else delete S.notes[p];clearTimeout(noteT);noteT=setTimeout(function(){save();var nl=$("notelist");if(nl){var tmp=document.createElement("div");tmp.innerHTML=notesListHtml();nl.innerHTML=tmp.firstChild.innerHTML;}},400);}
  else if(t.id==="q"){U.q=t.value;var pos=t.selectionStart;renderSide();var n=$("q");if(n){n.focus();n.setSelectionRange(pos,pos);}renderReader();}
});
document.addEventListener("keydown",function(e){
  var tg=e.target&&e.target.tagName; if(tg==="INPUT"||tg==="TEXTAREA"||tg==="SELECT")return; if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==="ArrowRight"){e.preventDefault();next();}
  else if(e.key==="ArrowLeft"){e.preventDefault();prev();}
  else if(e.key==="m"){mark(S.last,!isRead(S.last));renderTop();renderRail();renderReader();}
  else if(e.key==="t"){S.set.view=S.set.view==="page"?"text":"page";save();renderReader();}
  else if(e.key==="b"){var i=S.bm.indexOf(S.last);if(i>=0)S.bm.splice(i,1);else S.bm.push(S.last);save();renderReader();renderSide();}
  else if(U.tab==="check"){
    if(e.key===" "&&!U.reveal&&deck().length){e.preventDefault();U.reveal=true;renderSide();}
    else if(U.reveal&&(e.key==="1"||e.key==="2"||e.key==="3")){var q=deck()[U.qi];if(q){S.marks[q.id]={v:+e.key-1,ts:Date.now()};save();U.reveal=false;var d=deck();U.qi=Math.min(U.qi+1,Math.max(0,d.length-1));renderTop();renderRail();renderSide();}}
  }
});
/* reading timer: counts only while visible and recently active */
var lastAct=Date.now();
["pointerdown","keydown","scroll","touchstart","mousemove"].forEach(function(ev){window.addEventListener(ev,function(){lastAct=Date.now();},{passive:true});});
setInterval(function(){
  if(document.visibilityState!=="visible"||Date.now()-lastAct>90000)return;
  var k=today();S.mins[k]=Math.round(((S.mins[k]||0)+0.25)*100)/100;save();
  if(Math.round(S.mins[k]*4)%4===0)renderTop();
},15000);
var rt=null;window.addEventListener("resize",function(){clearTimeout(rt);rt=setTimeout(renderReader,150);});

/* boot */
document.addEventListener("change",function(e){if(e.target.id!=="impf")return;var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{S=merge(S,normalize(JSON.parse(r.result)));save();renderAll();alert("Progress imported and merged.");}catch(x){alert("That file could not be read.");}};r.readAsText(f);});
(function(){var l=localLoad();if(l)S=normalize(l);var n=phaseOf(S.last);ensurePhase(n,function(){applyPhase(n);U.open[chOf(S.last)]=true;renderAll();initCloud();});})();
})();
</script>
